<style>
:root{
  --dark:#0F1F3D; --ink:#1F2937; --muted:#6B7280; --line:#E2E5EA; --bg:#F5F6F8;
  --card:#FFFFFF; --green:#2E7D32; --danger:#C0392B; --test:#D84315;
  --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:48px;-webkit-text-size-adjust:100%;}
header{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.18);}
header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px;}
.headerRow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;}
.hbtn:hover{background:rgba(255,255,255,.22);}
.weekSel{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:3px 8px;font-size:12px;}
.weekSel select{background:transparent;color:#fff;border:none;font-size:12px;font-weight:700;padding:2px;width:auto;}
.weekSel select option{color:#111;}
#saveState{font-size:11px;opacity:.85;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.12);white-space:nowrap;}
#saveState.warn{background:#8D3B1E;opacity:1;}
nav{position:sticky;top:44px;z-index:19;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;padding:6px 8px;-webkit-overflow-scrolling:touch;}
nav button{border:none;background:transparent;padding:8px 13px;margin:0 2px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
nav button.active{background:var(--dark);color:#fff;}
main{padding:14px;max-width:1040px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
.card h2{margin:0 0 6px;font-size:16px;color:var(--dark);}
.card .accentbar{height:5px;border-radius:5px 5px 0 0;margin:-14px -14px 12px;}
.sub{color:var(--muted);font-size:12.5px;line-height:1.5;margin-bottom:10px;}
.paramsRow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px;background:#F8F9FB;border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
.paramsRow label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px;}
.paramsRow input[type=number]{width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
th,td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:center;white-space:nowrap;}
th{background:var(--dark);color:#fff;font-weight:600;}
td.name{text-align:left;min-width:150px;}
tr:nth-child(even) td{background:#F7F8FA;}
tr.total td{font-weight:700;background:#EEF1F6 !important;}
th.curweek{background:#F9A825;color:#3E2723;}
td.curweek{background:#FFF6D8 !important;font-weight:800;}
th.testcol{background:var(--test);color:#fff;}
td.testcol{background:#FBE9E7 !important;color:#8D3B1E;font-weight:800;font-size:11px;}
input[type=text],input[type=number],input[type=date],textarea,select{
  font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;width:100%;background:#fff;color:var(--ink);
}
textarea{line-height:1.45;}
td input[type=text]{min-width:130px;}
td input[type=number]{width:58px;}
.computed{color:var(--dark);font-weight:700;}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink);}
.btn:hover{background:#F3F4F6;}
.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark);}
.btn.test{background:var(--test);color:#fff;border-color:var(--test);}
.btn.small{padding:3px 8px;font-size:11px;}
.delbtn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:2px 4px;}
.syncbtn{background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px;line-height:1;}
.refCell{display:flex;align-items:center;gap:2px;justify-content:center;}
.banner{border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;line-height:1.45;}
.banner.info{background:#E8F0FE;border:1px solid #C3D6F7;color:#123A6B;}
.banner.test{background:#FBE9E7;border:1px solid #F3C0B3;color:#8D3B1E;}
.banner.warn{background:#FFF8E1;border:1px solid #F1D98B;color:#7A5B00;}
.banner.ok{background:#E8F5E9;border:1px solid #B7DFBA;color:#1B5E20;}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--dark);color:#fff;padding:10px 14px;border-radius:10px;font-size:12.5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;max-width:90vw;text-align:center;}
#toast button{margin-left:8px;background:#fff;color:var(--dark);border:none;border-radius:6px;padding:3px 9px;font-size:11.5px;font-weight:700;cursor:pointer;}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;font-size:12.5px;}
.kv .k{color:var(--muted);font-size:11.5px;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;word-break:break-all;}
ol.steps{padding-left:18px;font-size:12.5px;line-height:1.6;color:var(--ink);}
ol.steps code{background:#F3F4F6;border-radius:4px;padding:1px 5px;font-size:11.5px;}

/* ---------- Planning ---------- */
.weekGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;}
.dayCard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
.dayCard.today{border-color:var(--dark);box-shadow:0 0 0 2px rgba(15,31,61,.12);}
.dayHead{background:#F3F5F8;padding:7px 10px;font-weight:700;font-size:12.5px;color:var(--dark);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
.dayHead .todayTag{font-size:9.5px;background:var(--dark);color:#fff;border-radius:20px;padding:2px 7px;font-weight:700;letter-spacing:.4px;}
.dayBody{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1;}
.slot{border:1px solid var(--line);border-left:5px solid #90A4AE;border-radius:8px;padding:6px 7px;background:#FCFCFD;}
.slotTop{display:flex;gap:5px;align-items:center;}
.slotTop select{flex:1;font-weight:600;font-size:12px;border:none;background:transparent;padding:2px 0;}
.slotNote{margin-top:4px;font-size:11.5px;border:none;background:transparent;padding:1px 0;color:var(--muted);}
.goBtn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted);padding:0 2px;}
.addSlot{border:1px dashed var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:5px;font-size:11.5px;cursor:pointer;}
.addSlot:hover{color:var(--dark);border-color:var(--dark);}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.chip{font-size:11px;border-radius:20px;padding:3px 9px;font-weight:600;color:#fff;}
.statGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:10px;}
.stat{background:#F8F9FB;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
.stat .v{font-size:20px;font-weight:700;color:var(--dark);}
.stat .l{font-size:11px;color:var(--muted);}

/* ---------- Front Lever ---------- */
.flHead{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.flBadge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:none;}
.warmGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;}
.warmItem{border:1px solid var(--line);border-left:5px solid #00838F;border-radius:8px;padding:7px 9px;background:#FCFCFD;}
canvas{max-width:100%;width:100%;height:220px;display:block;}
.perfControls{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px;}
.perfControls > div{flex:1;min-width:118px;}
.perfControls label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px;}
select.realise-OUI{background:#E8F5E9;}
select.realise-NON{background:#FDECEA;}
@media (max-width:560px){
  main{padding:10px;}
  header h1{font-size:15px;}
  nav button{padding:7px 11px;font-size:12.5px;}
  .card{padding:11px;}
  .card .accentbar{margin:-11px -11px 10px;}
}
</style>
</head>

</header>

    safetyTitle:"Prévention des blessures (poignets, épaules, bas du dos)",
    safetyItems:[
      "Échauffement spécifique des poignets : 5-10 min avant toute charge horizontale.",
      "Utiliser des parallettes pour diminuer l'extension du poignet.",
      "Charge progressive : +5 à 10% de temps sous tension par semaine maximum.",
      "Différencier fatigue musculaire normale et douleur aiguë — stop immédiat si douleur persistante.",
      "48-72h de repos entre deux sessions intenses de planche."
    ],
    source:"Colonne Validé : OUI quand le critère est tenu 2 séances de suite."
  },
  defiPompes: {
    note:"Progression : +1 rep chaque jour. Décharge (moitié) : mercredi et dimanche.",
    days: (function(){
      const jours=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
      const out=[];
      for(let i=0;i<30;i++){
        const base=20+i, js=jours[i%7];
        const dech=(js==="Mercredi"||js==="Dimanche");
        out.push({jour:i+1, jourSemaine:js, base:base, objectif:dech?Math.floor(base/2):base, realise:"", reps:null});
      }
      return out;
    })()
  }
};
</script>
<script>
/* ===================== Utils ===================== */
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function today(){ return new Date().toISOString().slice(0,10); }
function computeWeekVal(maxRef, basePct, growthPct, weekIdx){
  const ref = Number(maxRef);
  if(!ref || ref<=0) return null;
  return Math.round(ref * basePct * Math.pow(1+growthPct, weekIdx-1));
}
function fmtCell(v){ return v===null || v===undefined ? '—' : v; }
function actColor(name){ const a = ACTIVITIES.find(x=>x.name===name); return a ? a.color : '#90A4AE'; }
function actTab(name){ const a = ACTIVITIES.find(x=>x.name===name); return a ? a.tab : null; }

/* ===================== Sauvegarde automatique ===================== */
const STORE_KEY = 'planning-calisthenie-v2';
let storageOK = false;
try{
  window.localStorage.setItem('__pc_test__','1');
  window.localStorage.removeItem('__pc_test__');
  storageOK = true;
}catch(e){ storageOK = false; }

let saveTimer = null;
function scheduleSave(){
  if(!storageOK) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 400);
}
function stampLocal(){
  if(!STATE.meta) STATE.meta = {};
  STATE.meta.updatedAt = new Date().toISOString();
  STATE.meta.device = STATE.meta.device || deviceLabel();
}
let applyingRemote = false;
function saveNow(opts){
  const silent = (opts && opts.silent) || applyingRemote;
  if(!silent) stampLocal();
  if(storageOK){
    try{
      window.localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
      setSaveState(SYNC.enabled ? syncLabel() : '✓ Sauvegardé', false);
    }catch(e){ setSaveState('⚠ Stockage plein', true); }
  }
  if(!silent && SYNC.enabled) schedulePush();
}
function setSaveState(txt, warn){
  const el = document.getElementById('saveState');
  if(!el) return;
  el.textContent = txt;
  el.className = warn ? 'warn' : '';
}
function deviceLabel(){
  const ua = navigator.userAgent || '';
  if(/iPhone|iPad/i.test(ua)) return 'iPhone/iPad';
  if(/Android/i.test(ua)) return 'Android';
  if(/Mac/i.test(ua)) return 'Mac';
  if(/Windows/i.test(ua)) return 'PC';
  return 'appareil';
}
function loadSaved(){
  if(!storageOK) return null;
  try{
    const raw = window.localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(!obj || !obj.seances || !obj.planning) return null;
    return obj;
  }catch(e){ return null; }
}

/* ===================== Synchro GitHub Gist =====================
   Le token vit dans une clé localStorage séparée : il n'apparaît JAMAIS
   dans l'export JSON ni dans le Gist. Portée minimale requise : "gist". */
const SYNC_KEY = 'planning-calisthenie-sync';
const GIST_FILE = 'planning-calisthenie.json';
let SYNC = {enabled:false, token:'', gistId:'', lastRemoteAt:'', lastSyncAt:'', lastError:''};
let pushTimer = null, syncBusy = false;

function loadSync(){
  if(!storageOK) return;
  try{
    const raw = window.localStorage.getItem(SYNC_KEY);
    if(raw) SYNC = Object.assign(SYNC, JSON.parse(raw));
  }catch(e){}
}
function saveSync(){
  if(!storageOK) return;
  try{ window.localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC)); }catch(e){}
}
function syncLabel(){
  if(!SYNC.enabled) return storageOK ? '✓ Local' : '⚠ Export requis';
  if(!navigator.onLine) return '☁ hors-ligne';
  if(syncBusy) return '☁ …';
  if(SYNC.lastError) return '☁ erreur';
  if(SYNC.lastSyncAt) return '☁ ' + SYNC.lastSyncAt.slice(11,16);
  return '☁ prêt';
}
function refreshSyncPill(){ setSaveState(SYNC.enabled ? syncLabel() : (storageOK?'✓ Sauvegarde auto':'⚠ Utilise 💾 Export'), !!SYNC.lastError || !storageOK); }

async function ghFetch(path, opts){
  const res = await fetch('https://api.github.com'+path, Object.assign({
    headers: {
      'Authorization': 'Bearer ' + SYNC.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }
  }, opts||{}));
  if(!res.ok){
    let msg = res.status + ' ' + res.statusText;
    try{ const j = await res.json(); if(j.message) msg += ' — ' + j.message; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}
function schedulePush(){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>pushRemote(true), 2500);
}
async function pushRemote(auto){
  if(!SYNC.enabled || !SYNC.token) return;
  if(!navigator.onLine){ SYNC.lastError=''; refreshSyncPill(); return; }
  syncBusy = true; refreshSyncPill();
  try{
    const payload = deepClone(STATE);
    const body = {files:{}};
    body.files[GIST_FILE] = {content: JSON.stringify(payload, null, 1)};
    let g;
    if(SYNC.gistId){
      // Détection de conflit : quelqu'un d'autre a poussé depuis notre dernier pull ?
      const remote = await ghFetch('/gists/'+SYNC.gistId);
      const rf = remote.files && remote.files[GIST_FILE];
      if(rf && SYNC.lastRemoteAt && remote.updated_at !== SYNC.lastRemoteAt){
        let rdata = null;
        try{ rdata = JSON.parse(rf.truncated ? await (await fetch(rf.raw_url)).text() : rf.content); }catch(e){}
        const rAt = rdata && rdata.meta ? rdata.meta.updatedAt : null;
        const lAt = STATE.meta ? STATE.meta.updatedAt : null;
        if(rAt && lAt && rAt > lAt){
          syncBusy = false;
          SYNC.lastError = 'conflit';
          refreshSyncPill(); saveSync();
          toast('Version distante plus récente ('+fmtDT(rAt)+').', 'Récupérer', ()=>pullRemote(true));
          return;
        }
      }
      body.description = 'Planning Calisthénie — sauvegarde ('+deviceLabel()+')';
      g = await ghFetch('/gists/'+SYNC.gistId, {method:'PATCH', body: JSON.stringify(body)});
    }else{
      body.public = false;
      body.description = 'Planning Calisthénie — sauvegarde ('+deviceLabel()+')';
      g = await ghFetch('/gists', {method:'POST', body: JSON.stringify(body)});
      SYNC.gistId = g.id;
    }
    SYNC.lastRemoteAt = g.updated_at;
    SYNC.lastSyncAt = new Date().toISOString();
    SYNC.lastError = '';
    saveSync(); syncBusy = false; refreshSyncPill();
    if(currentTab==='sync') renderPage();
    if(!auto) toast('Envoyé sur GitHub ✓');
  }catch(e){
    syncBusy = false; SYNC.lastError = e.message; saveSync(); refreshSyncPill();
    if(!auto) alert('Échec de l\'envoi : ' + e.message);
    if(currentTab==='sync') renderPage();
  }
}
async function pullRemote(force){
  if(!SYNC.enabled || !SYNC.token || !SYNC.gistId) return;
  if(!navigator.onLine) return;
  syncBusy = true; refreshSyncPill();
  try{
    const g = await ghFetch('/gists/'+SYNC.gistId);
    const f = g.files && g.files[GIST_FILE];
    if(!f) throw new Error('fichier ' + GIST_FILE + ' absent du Gist');
    const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    const obj = JSON.parse(txt);
    if(!obj.seances || !obj.planning) throw new Error('contenu inattendu');
    const rAt = obj.meta ? obj.meta.updatedAt : null;
    const lAt = STATE.meta ? STATE.meta.updatedAt : null;
    if(!force && lAt && rAt && rAt <= lAt){
      SYNC.lastRemoteAt = g.updated_at; SYNC.lastSyncAt = new Date().toISOString(); SYNC.lastError='';
      saveSync(); syncBusy=false; refreshSyncPill(); return;
    }
    STATE = obj; migrate(); syncRefs();
    selectedPerfExercise = null; seanceChartSel = {};
    SYNC.lastRemoteAt = g.updated_at;
    SYNC.lastSyncAt = new Date().toISOString();
    SYNC.lastError = '';
    applyingRemote = true;
    saveSync(); saveNow({silent:true}); syncBusy = false;
    renderWeekSelect(); renderPage();
    applyingRemote = false;
    refreshSyncPill();
    toast('Données récupérées depuis GitHub ✓');
  }catch(e){
    syncBusy = false; SYNC.lastError = e.message; saveSync(); refreshSyncPill();
    if(force) alert('Échec de la récupération : ' + e.message);
    if(currentTab==='sync') renderPage();
  }
}
function fmtDT(iso){
  if(!iso) return '—';
  try{ const d = new Date(iso); return d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
let toastTimer=null;
function toast(msg, actionLabel, action){
  const el = document.getElementById('toast');
  if(!el) return;
  el.innerHTML = escapeHtml(msg) + (actionLabel?`<button id="toastBtn">${escapeHtml(actionLabel)}</button>`:'');
  el.style.display = 'block';
  if(actionLabel){
    document.getElementById('toastBtn').onclick = ()=>{ el.style.display='none'; if(action) action(); };
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, actionLabel?12000:3500);
}

/* ===================== State ===================== */
let STATE = loadSaved() || deepClone(SEED);
let currentTab = 'planning';
let selectedPerfExercise = null;
let seanceChartSel = {};
let testDraft = {};
let compactWeeks = (typeof window!=='undefined' && window.innerWidth < 640);

const TABS = [
  {id:'planning',        label:'Planning'},
  {id:'streetOriginal',  label:'Street Original'},
  {id:'streetPlus',      label:'Street Plus'},
  {id:'abdo',            label:'Abdo'},
  {id:'frontLever',      label:'Front Lever'},
  {id:'performances',    label:'Performances'},
  {id:'defiPompes',      label:'Défi Pompes'},
  {id:'fullPlanche',     label:'Full Planche'},
  {id:'sync',            label:'☁ Synchro'}
];
const SEANCE_KEYS = ['streetOriginal','streetPlus','abdo'];

/* ===================== Synchronisation perfs → Max réf. ===================== */
function latestPerf(name){
  const arr = STATE.performances[name];
  if(!arr || !arr.length) return null;
  const s = arr.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const v = s[s.length-1].reps;
  return (typeof v === 'number' && !isNaN(v)) ? v : null;
}
function perfDate(name){
  const arr = STATE.performances[name];
  if(!arr || !arr.length) return null;
  const s = arr.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return s[s.length-1].date;
}
function syncRefs(){
  SEANCE_KEYS.forEach(k=>{
    const s = STATE.seances[k];
    if(!s) return;
    s.blocks.forEach(b=>b.exercises.forEach(ex=>{
      if(ex.auto === undefined) ex.auto = true;
      if(ex.auto){
        const p = latestPerf(ex.name);
        if(p !== null && p > 0) ex.ref = p;
      }
    }));
  });
}
function seancesUsing(name){
  const out = [];
  SEANCE_KEYS.forEach(k=>{
    const s = STATE.seances[k];
    if(s && s.blocks.some(b=>b.exercises.some(ex=>ex.name===name))) out.push(s.label);
  });
  return out;
}

/* ===================== Nav ===================== */
function renderNav(){
  document.getElementById('tabnav').innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}" class="${t.id===currentTab?'active':''}" onclick="switchTab('${t.id}')">${escapeHtml(t.label)}</button>`
  ).join('');
}
function renderWeekSelect(){
  const sel = document.getElementById('weekSelect');
  let opts = '';
  for(let n=1;n<=WEEKS;n++){
    opts += `<option value="${n}" ${n===STATE.semaine?'selected':''}>S${n}${n===TEST_WEEK?' · TEST':''}</option>`;
  }
  sel.innerHTML = opts;
}
function setWeek(v){ STATE.semaine = parseInt(v,10)||1; renderWeekSelect(); renderPage(); scheduleSave(); }
function switchTab(id){
  currentTab = id;
  renderNav(); renderPage();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ===================== Dispatch ===================== */
function renderPage(){
  syncRefs();
  const main = document.getElementById('mainArea');
  if(SEANCE_KEYS.includes(currentTab)){
    main.innerHTML = renderSeanceHtml(currentTab);
    recomputeSeance(currentTab);
    drawSeanceChart(currentTab);
  } else if(currentTab === 'planning'){
    main.innerHTML = renderPlanningHtml();
  } else if(currentTab === 'performances'){
    main.innerHTML = renderPerformancesHtml();
    initPerfPage();
  } else if(currentTab === 'fullPlanche'){
    main.innerHTML = renderPhaseHtml('fullPlanche', 'Full Planche', '#C62828');
  } else if(currentTab === 'frontLever'){
    main.innerHTML = renderFrontLeverHtml();
  } else if(currentTab === 'defiPompes'){
    main.innerHTML = renderDefiHtml();
    recomputeDefi();
  } else if(currentTab === 'sync'){
    main.innerHTML = renderSyncHtml();
  }
  scheduleSave();
}

/* ===================== Planning ===================== */
function todayIndex(){ const d = new Date().getDay(); return (d+6)%7; }
function renderPlanningHtml(){
  const p = STATE.planning;
  const ti = todayIndex();
  const opts = act => ACTIVITIES.map(a=>`<option value="${escapeAttr(a.name)}" ${a.name===act?'selected':''}>${escapeHtml(a.name)}</option>`).join('');

  const days = p.days.map((d,di)=>{
    const slots = d.slots.map((s,si)=>{
      const tab = actTab(s.act);
      return `
      <div class="slot" style="border-left-color:${actColor(s.act)};">
        <div class="slotTop">
          <select onchange="setSlotAct(${di},${si},this.value)">${opts(s.act)}</select>
          ${tab?`<button class="goBtn" title="Ouvrir la séance" onclick="switchTab('${tab}')">↗</button>`:''}
          <button class="delbtn" title="Supprimer" onclick="removeSlot(${di},${si})">✕</button>
        </div>
        <input class="slotNote" type="text" placeholder="note (durée, focus…)" value="${escapeAttr(s.note)}" oninput="STATE.planning.days[${di}].slots[${si}].note=this.value">
      </div>`;
    }).join('');
    return `
      <div class="dayCard ${di===ti?'today':''}">
        <div class="dayHead"><span>${escapeHtml(d.day)}</span>${di===ti?'<span class="todayTag">AUJOURD\'HUI</span>':''}</div>
        <div class="dayBody">
          ${slots || '<div style="font-size:11.5px;color:var(--muted);padding:4px 2px;">Rien de prévu.</div>'}
          <button class="addSlot" onclick="addSlot(${di})">+ Ajouter un créneau</button>
        </div>
      </div>`;
  }).join('');

  const counts = {};
  p.days.forEach(d=>d.slots.forEach(s=>{ if(s.act!=='Repos'){ counts[s.act]=(counts[s.act]||0)+1; } }));
  const legend = Object.keys(counts).sort().map(k=>
    `<span class="chip" style="background:${actColor(k)}">${escapeHtml(k)} × ${counts[k]}</span>`).join('') ||
    '<span style="font-size:11.5px;color:var(--muted)">Aucune séance placée.</span>';
  const nbSeances = Object.values(counts).reduce((a,b)=>a+b,0);
  const nbRepos = p.days.filter(d=>d.slots.every(s=>s.act==='Repos')).length;
  const testBanner = STATE.semaine===TEST_WEEK
    ? `<div class="banner test"><b>Semaine test (S8)</b> — sur chaque séance : ${escapeHtml(STATE.testProtocol.series)} séries au max, ${escapeHtml(STATE.testProtocol.repos)} de repos. Logue les résultats, les Max réf. se mettent à jour tout seuls.</div>` : '';

  return `
    <div class="card">
      <div class="accentbar" style="background:#37474F"></div>
      <h2>Planning hebdomadaire — semaine S${STATE.semaine}${STATE.semaine===TEST_WEEK?' (TEST)':''}</h2>
      ${testBanner}
      <div class="sub">Un créneau = une séance. Change le contenu dans le menu déroulant, ajoute-en autant que tu veux, et clique sur ↗ pour ouvrir la séance correspondante.</div>
      <div class="statGrid">
        <div class="stat"><div class="v">${nbSeances}</div><div class="l">Créneaux actifs</div></div>
        <div class="stat"><div class="v">${nbRepos}</div><div class="l">Jours 100% repos</div></div>
        <div class="stat"><div class="v">S${STATE.semaine}/${WEEKS}</div><div class="l">Semaine du cycle</div></div>
      </div>
      <div class="weekGrid">${days}</div>
      <div class="legend" style="margin-top:12px;">${legend}</div>
      <label style="font-size:11.5px;color:var(--muted);display:block;margin-top:12px;">Note de la semaine</label>
      <textarea rows="2" oninput="STATE.planning.note=this.value">${escapeHtml(p.note)}</textarea>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn small" onclick="clearWeek()">Vider la semaine</button>
        <button class="btn small" onclick="shiftWeek()">Décaler d'un jour →</button>
      </div>
    </div>`;
}
function setSlotAct(di,si,val){ STATE.planning.days[di].slots[si].act = val; renderPage(); }
function addSlot(di){ STATE.planning.days[di].slots.push({act:'Libre / au feeling', note:''}); renderPage(); }
function removeSlot(di,si){ STATE.planning.days[di].slots.splice(si,1); renderPage(); }
function clearWeek(){
  if(confirm('Vider tous les créneaux de la semaine ?')){
    STATE.planning.days.forEach(d=>d.slots=[{act:'Repos',note:''}]);
    renderPage();
  }
}
function shiftWeek(){
  const d = STATE.planning.days;
  const slots = d.map(x=>x.slots);
  slots.unshift(slots.pop());
  d.forEach((x,i)=>x.slots=slots[i]);
  renderPage();
}

/* ===================== Séances ===================== */
function visibleWeeks(){
  if(!compactWeeks) { const a=[]; for(let n=1;n<=WEEKS;n++) a.push(n); return a; }
  const cur = STATE.semaine;
  return cur===TEST_WEEK ? [TEST_WEEK] : [cur, TEST_WEEK];
}
function renderSeanceHtml(key){
  const s = STATE.seances[key];
  const cur = STATE.semaine;
  const wks = visibleWeeks();
  const weekHeaders = wks.map(n=>`<th class="${n===TEST_WEEK?'testcol':(n===cur?'curweek':'')}">S${n}${n===TEST_WEEK?' TEST':''}</th>`).join('');

  const blocksHtml = s.blocks.map((b, bi) => {
    const rows = b.exercises.map((ex, ei) => {
      const cells = wks.map(n => {
        if(n===TEST_WEEK) return `<td class="testcol">MAX ×${escapeHtml(STATE.testProtocol.series)}</td>`;
        const v = computeWeekVal(ex.ref, s.basePct, s.growthPct, n);
        return `<td class="computed ${n===cur?'curweek':''}" id="w_${key}_${bi}_${ei}_${n}">${fmtCell(v)}</td>`;
      }).join('');
      const auto = ex.auto !== false;
      const pd = perfDate(ex.name);
      const syncTitle = auto
        ? (pd ? `Synchronisé avec ta dernière perf (${pd}). Clic = passer en manuel.` : 'Synchro auto activée : dès que tu logges une perf pour cet exercice, la valeur se met à jour.')
        : 'Valeur manuelle. Clic = réactiver la synchro avec tes perfs.';
      return `<tr>
        <td class="name"><input type="text" value="${escapeAttr(ex.name)}" oninput="STATE.seances['${key}'].blocks[${bi}].exercises[${ei}].name=this.value" onchange="renderPage()"></td>
        <td><div class="refCell">
          <input type="number" value="${escapeAttr(ex.ref)}" oninput="setRefManual('${key}',${bi},${ei},this.value)">
          <button class="syncbtn" title="${escapeAttr(syncTitle)}" onclick="toggleAuto('${key}',${bi},${ei})">${auto?'🔄':'🔒'}</button>
        </div></td>
        ${cells}
        <td><input type="text" value="${escapeAttr(ex.repos)}" style="width:96px;" oninput="STATE.seances['${key}'].blocks[${bi}].exercises[${ei}].repos=this.value"></td>
        <td><button class="delbtn" onclick="removeExercise('${key}',${bi},${ei})">🗑</button></td>
      </tr>`;
    }).join('');
    const totalCells = wks.map(n => n===TEST_WEEK
      ? `<td class="testcol">—</td>`
      : `<td class="${n===cur?'curweek':''}" id="total_${key}_${bi}_${n}"></td>`).join('');
    return `
      <div style="margin-bottom:14px;">
        ${b.label ? `<div style="display:flex;gap:8px;align-items:center;">
            <input type="text" style="flex:1;font-weight:700;border:none;background:transparent;color:${s.accent};font-size:13.5px;" value="${escapeAttr(b.label)}" oninput="STATE.seances['${key}'].blocks[${bi}].label=this.value">
            <button class="delbtn" onclick="removeBlock('${key}',${bi})">🗑 bloc</button>
          </div>` : ''}
        ${b.note!==null && b.note!==undefined ? `<textarea rows="1" style="font-size:11.5px;color:var(--muted);border:none;background:transparent;" oninput="STATE.seances['${key}'].blocks[${bi}].note=this.value">${escapeHtml(b.note)}</textarea>` : ''}
        <div class="tablewrap">
          <table>
            <thead><tr><th style="text-align:left;">Exercice</th><th>Max réf.</th>${weekHeaders}<th>Repos</th><th></th></tr></thead>
            <tbody>${rows}<tr class="total"><td class="name">TOTAL / tour</td><td></td>${totalCells}<td></td><td></td></tr></tbody>
          </table>
        </div>
        <button class="btn small" style="margin-top:6px;" onclick="addExercise('${key}',${bi})">+ Ajouter un exercice</button>
      </div>`;
  }).join('');

  const exNames = [];
  s.blocks.forEach(b=>b.exercises.forEach(ex=>{ if(ex.name) exNames.push(ex.name); }));

function saveTest(key){
  const s = STATE.seances[key];
  const dateEl = document.getElementById('testDate_'+key);
  const date = (dateEl && dateEl.value) ? dateEl.value : today();
  let n = 0;
  s.blocks.forEach((b,bi)=>b.exercises.forEach((ex,ei)=>{
    const id = key+'_'+bi+'_'+ei;
    const a = parseFloat((document.getElementById('t1_'+id)||{}).value);
    const c = parseFloat((document.getElementById('t2_'+id)||{}).value);
    const vals = [a,c].filter(v=>!isNaN(v));
    if(!vals.length) return;
    const best = Math.max.apply(null, vals);
    if(!STATE.performances[ex.name]) STATE.performances[ex.name] = [];
    STATE.performances[ex.name] = STATE.performances[ex.name].filter(e=>e.date!==date);
    STATE.performances[ex.name].push({date, reps:best});
    STATE.performances[ex.name].sort((x,y)=>String(x.date).localeCompare(String(y.date)));
    ex.auto = true;
    n++;
  }));
  if(!n){ alert('Aucune valeur saisie.'); return; }
  syncRefs(); renderPage(); saveNow();
  alert(n + ' test(s) enregistré(s). Les Max réf. sont à jour — passe en S1 pour relancer le cycle.');
}
function setRefManual(key,bi,ei,val){
  const ex = STATE.seances[key].blocks[bi].exercises[ei];
  ex.ref = parseFloat(val)||0;
  ex.auto = false;
  recomputeSeance(key);
  const btn = document.querySelector(`#w_${key}_${bi}_${ei}_1`);
  scheduleSave();
}
function toggleAuto(key,bi,ei){
  const ex = STATE.seances[key].blocks[bi].exercises[ei];
  ex.auto = (ex.auto === false);
  renderPage();
}
function recomputeSeance(key){
  const s = STATE.seances[key];
  const wks = visibleWeeks();
  s.blocks.forEach((b,bi)=>{
    const totals={}, counts={};
    wks.forEach(n=>{ totals[n]=0; counts[n]=0; });
    b.exercises.forEach((ex,ei)=>{
      wks.forEach(n=>{
        if(n===TEST_WEEK) return;
        const v = computeWeekVal(ex.ref, s.basePct, s.growthPct, n);
        const cell = document.getElementById(`w_${key}_${bi}_${ei}_${n}`);
        if(cell) cell.textContent = fmtCell(v);
        if(v!==null){ totals[n]+=v; counts[n]++; }
      });
    });
    wks.forEach(n=>{
      if(n===TEST_WEEK) return;
      const t = document.getElementById(`total_${key}_${bi}_${n}`);
      if(t) t.textContent = counts[n]>0 ? totals[n] : '—';
    });
  });
}

  const entries = (name && STATE.performances[name]) ? STATE.performances[name] : [];
  drawLineChart(canvas, entries.map(e=>e.date), entries.map(e=>e.reps), STATE.seances[key].accent);
}

    ).join('') || '<tr><td colspan="3" style="color:var(--muted);">Aucune perf loggée pour cet exercice.</td></tr>';

  const canvas = document.getElementById('perfChart');
  if(canvas) drawLineChart(canvas, entries.map(e=>e.date), entries.map(e=>e.reps), '#283593');
}

/* Graphique canvas maison — aucune dépendance externe. */
function drawLineChart(canvas, labels, values, color){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 320, h = canvas.clientHeight || 220;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if(!values.length){
    ctx.fillStyle = '#6B7280'; ctx.font='13px Arial';
    ctx.fillText('Aucune perf loggée pour le moment.', 10, h/2);
    return;
  }
  const padL=38, padR=14, padT=16, padB=26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const maxV = Math.max.apply(null, values), minV = Math.min.apply(null, [0].concat(values));
  const range = (maxV-minV) || 1;
  ctx.strokeStyle = '#E2E5EA'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,padT+plotH); ctx.lineTo(padL+plotW,padT+plotH); ctx.stroke();
  ctx.font = '10px Arial'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const v = minV + range*i/4;
    const y = padT+plotH - (v-minV)/range*plotH;
    ctx.strokeStyle = '#F0F1F3'; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke();
    ctx.fillStyle = '#6B7280'; ctx.fillText(Math.round(v), padL-6, y);
  }
  const n = values.length;
  const stepX = n>1 ? plotW/(n-1) : 0;
  const pts = values.map((v,i)=>({x: padL + (n>1 ? i*stepX : plotW/2), y: padT+plotH-(v-minV)/range*plotH}));
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.beginPath();
  pts.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.stroke();
  ctx.lineTo(pts[pts.length-1].x, padT+plotH); ctx.lineTo(pts[0].x, padT+plotH); ctx.closePath();
  ctx.fillStyle = color + '22'; ctx.fill();
  ctx.textAlign = 'center';
  pts.forEach((p,i)=>{
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x,p.y,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1F2937'; ctx.font = '10px Arial'; ctx.textBaseline='bottom';
    ctx.fillText(values[i], p.x, p.y-6);
  });
  ctx.fillStyle = '#6B7280'; ctx.font = '9.5px Arial'; ctx.textBaseline = 'top';
  const showEvery = Math.max(1, Math.ceil(n/6));
  labels.forEach((lab,i)=>{
    if(i%showEvery!==0 && i!==n-1) return;
    ctx.fillText(String(lab).slice(5), pts[i].x, padT+plotH+6);
  });
}

/* ===================== Défi Pompes ===================== */
function renderDefiHtml(){
  const d = STATE.defiPompes;
  const rows = d.days.map((day,i) => `
    <tr>
      <td>J-${day.jour}</td>
      <td>${escapeHtml(day.jourSemaine)}</td>
      <td><input type="number" value="${escapeAttr(day.objectif)}" style="width:58px;" oninput="STATE.defiPompes.days[${i}].objectif=parseFloat(this.value)||0;recomputeDefi()"></td>
      <td><select class="realise-${day.realise}" onchange="STATE.defiPompes.days[${i}].realise=this.value;recomputeDefi();this.className='realise-'+this.value">
        <option value="" ${day.realise===''?'selected':''}>—</option>
        <option value="OUI" ${day.realise==='OUI'?'selected':''}>OUI</option>
        <option value="NON" ${day.realise==='NON'?'selected':''}>NON</option>
      </select></td>
      <td><input type="number" value="${day.reps===null||day.reps===undefined?'':day.reps}" style="width:58px;" oninput="STATE.defiPompes.days[${i}].reps=this.value===''?null:parseFloat(this.value);recomputeDefi()"></td>
      <td id="ecart_${i}">—</td>
    </tr>`).join('');
  return `
    <div class="card">
      <div class="accentbar" style="background:#AD1457"></div>
      <h2>Défi Pompes — 30 jours</h2>
      <textarea class="sub" rows="1" oninput="STATE.defiPompes.note=this.value">${escapeHtml(d.note)}</textarea>
      <div class="statGrid" id="defiStats"></div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Jour</th><th>Jour sem.</th><th>Objectif</th><th>Réalisé</th><th>Reps réelles</th><th>Écart</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}
function recomputeDefi(){
  const d = STATE.defiPompes;
  let done=0, failed=0, totalReps=0;
  d.days.forEach((day,i)=>{
    if(day.realise==='OUI') done++;
    if(day.realise==='NON') failed++;
    if(typeof day.reps==='number') totalReps += day.reps;
    const c = document.getElementById(`ecart_${i}`);
    if(c) c.textContent = (day.reps===null||day.reps===undefined) ? '—' : (day.reps-day.objectif);
  });
  const rate = Math.round(done/d.days.length*100);
  const stats = document.getElementById('defiStats');
  if(stats){
    stats.innerHTML = `
      <div class="stat"><div class="v">${done}</div><div class="l">Jours complétés</div></div>
      <div class="stat"><div class="v">${failed}</div><div class="l">Jours ratés</div></div>
      <div class="stat"><div class="v">${totalReps}</div><div class="l">Total reps</div></div>
      <div class="stat"><div class="v">${rate}%</div><div class="l">Taux de complétion</div></div>`;
  }
}

/* ===================== Page Synchro ===================== */
function renderSyncHtml(){
  const on = SYNC.enabled;
  const statut = !on ? '<span class="banner warn">Synchro désactivée — les données restent sur cet appareil uniquement.</span>'
    : SYNC.lastError ? `<span class="banner test">Dernière erreur : ${escapeHtml(SYNC.lastError)}</span>`
    : `<span class="banner ok">Synchro active — dernier échange : ${escapeHtml(fmtDT(SYNC.lastSyncAt))}</span>`;
  return `
    <div class="card">
      <div class="accentbar" style="background:#0F1F3D"></div>
      <h2>☁ Synchro téléphone ↔ ordinateur</h2>
      <div class="sub">Tes données sont stockées dans un <b>Gist secret</b> de ton compte GitHub. Chaque appareil pousse ses modifications et récupère celles des autres. Aucun serveur, aucun abonnement.</div>
      ${statut}
      <div class="kv" style="margin-top:10px;">
        <div class="k">Token GitHub (portée <code>gist</code>)</div>
        <div><input type="password" id="syncToken" placeholder="ghp_… ou github_pat_…" value="${escapeAttr(SYNC.token)}" autocomplete="off"></div>
        <div class="k">Identifiant du Gist</div>
        <div><input type="text" id="syncGist" placeholder="laisse vide : il sera créé automatiquement" value="${escapeAttr(SYNC.gistId)}"></div>
        <div class="k">Synchro automatique</div>
        <div><label style="font-size:12.5px;"><input type="checkbox" id="syncOn" ${on?'checked':''} style="width:auto;margin-right:6px;">Activer (envoi 2,5 s après chaque modification, récupération à l'ouverture)</label></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
        <button class="btn primary" onclick="applySyncSettings()">Enregistrer</button>
        <button class="btn" onclick="pushRemote(false)">⬆ Envoyer maintenant</button>
        <button class="btn" onclick="pullRemote(true)">⬇ Récupérer maintenant</button>
        <button class="btn" onclick="forgetSync()">Oublier le token</button>
      </div>
      <div class="kv" style="margin-top:14px;">
        <div class="k">Dernière modif. locale</div><div>${escapeHtml(fmtDT(STATE.meta && STATE.meta.updatedAt))} — ${escapeHtml((STATE.meta&&STATE.meta.device)||deviceLabel())}</div>
        <div class="k">Gist</div><div class="mono">${SYNC.gistId?`<a href="https://gist.github.com/${escapeAttr(SYNC.gistId)}" target="_blank" rel="noopener">gist.github.com/${escapeHtml(SYNC.gistId)}</a>`:'—'}</div>
        <div class="k">Connexion</div><div>${navigator.onLine?'en ligne':'hors-ligne (la synchro reprendra au retour du réseau)'}</div>
      </div>
    </div>

    <div class="card">
      <h2>Mettre en place en 4 étapes</h2>
      <ol class="steps">
        <li>Sur GitHub : <b>Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token</b>.</li>
        <li>Coche <b>uniquement</b> la case <code>gist</code>. Aucune autre. Expiration : ce que tu veux (« No expiration » évite d'y revenir).</li>
        <li>Copie le token, colle-le ci-dessus, coche <b>Activer</b>, clique <b>Enregistrer</b> puis <b>⬆ Envoyer maintenant</b>. L'identifiant du Gist se remplit tout seul.</li>
        <li>Sur ton autre appareil : ouvre la même adresse, colle le <b>même token</b> et le <b>même identifiant de Gist</b>, active, puis <b>⬇ Récupérer</b>.</li>
      </ol>
      <div class="banner warn" style="margin-top:10px;">Le token est enregistré en clair dans le navigateur de cet appareil. Quiconque a accès à l'appareil déverrouillé peut le lire. Avec la portée <code>gist</code> seule, il ne donne accès qu'à tes Gists — pas à ton code. En cas de perte de l'appareil : révoque le token sur GitHub, il devient inutilisable.</div>
    </div>

    <div class="card">
      <h2>Règle de résolution des conflits</h2>
      <div class="sub">Avant chaque envoi, l'appli compare la date de dernière modification locale et distante. Si la version distante est plus récente, elle refuse d'écraser et te propose de la récupérer. Le dernier appareil à enregistrer gagne — donc évite de modifier la même séance sur deux appareils sans synchroniser entre les deux.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn" onclick="exportData()">💾 Export JSON (sauvegarde froide)</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">📂 Import JSON</button>
      </div>
    </div>`;
}
function applySyncSettings(){
  SYNC.token = document.getElementById('syncToken').value.trim();
  SYNC.gistId = document.getElementById('syncGist').value.trim().replace(/^.*gist\.github\.com\//,'');
  SYNC.enabled = document.getElementById('syncOn').checked;
  SYNC.lastError = '';
  if(SYNC.enabled && !SYNC.token){ SYNC.enabled = false; alert('Il faut un token pour activer la synchro.'); }
  saveSync(); refreshSyncPill(); renderPage();
  if(SYNC.enabled) toast('Réglages enregistrés. Utilise ⬆ Envoyer ou ⬇ Récupérer.');
}
function forgetSync(){
  if(!confirm('Effacer le token et l\'identifiant du Gist de cet appareil ? Le Gist lui-même reste intact sur GitHub.')) return;
  SYNC = {enabled:false, token:'', gistId:'', lastRemoteAt:'', lastSyncAt:'', lastError:''};
  saveSync(); refreshSyncPill(); renderPage();
}

/* ===================== Export / Import / Reset ===================== */
function exportData(){
  const blob = new Blob([JSON.stringify(STATE, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `planning-calisthenie-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const obj = JSON.parse(e.target.result);
      if(!obj.seances || !obj.planning) throw new Error('structure inattendue');
      if(!obj.planning.days || !obj.planning.days[0] || !obj.planning.days[0].slots) throw new Error('ancien format de planning');
      STATE = obj;
      migrate();
      selectedPerfExercise = null; seanceChartSel = {};
      renderWeekSelect(); renderPage(); saveNow();
      alert('Données chargées ✅');
    }catch(err){ alert('Fichier invalide : ' + err.message); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function resetData(){
  if(confirm("Repartir des données d'origine ? Tout ce qui est enregistré sur cet appareil sera effacé.")){
    STATE = deepClone(SEED);
    selectedPerfExercise = null; seanceChartSel = {};
    if(storageOK){ try{ window.localStorage.removeItem(STORE_KEY); }catch(e){} }
    renderWeekSelect(); renderPage(); saveNow();
  }
}

/* ===================== Migration / Init ===================== */
function migrate(){
  if(!STATE.semaine) STATE.semaine = 1;
  if(!STATE.testProtocol) STATE.testProtocol = deepClone(SEED.testProtocol);
  if(!STATE.performances) STATE.performances = {};
  SEANCE_KEYS.forEach(k=>{
    if(!STATE.seances[k]) STATE.seances[k] = deepClone(SEED.seances[k]);
    STATE.seances[k].blocks.forEach(b=>b.exercises.forEach(ex=>{ if(ex.auto===undefined) ex.auto = true; }));
  });
  STATE.version = 2;
}
migrate();
loadSync();
syncRefs();

const hash = (location.hash||'').replace('#','');
if(TABS.some(t=>t.id===hash)) currentTab = hash;

renderWeekSelect();
renderNav();
renderPage();
refreshSyncPill();

document.addEventListener('input', scheduleSave, true);
document.addEventListener('change', scheduleSave, true);
window.addEventListener('pagehide', ()=>saveNow());
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ saveNow(); }
  else if(SYNC.enabled){ pullRemote(false); }
});
window.addEventListener('online', ()=>{ refreshSyncPill(); if(SYNC.enabled) pullRemote(false); });
window.addEventListener('offline', refreshSyncPill);
if(SYNC.enabled) pullRemote(false);

/* Service worker : l'appli s'ouvre hors-ligne et se met à jour toute seule. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            toast('Nouvelle version disponible.', 'Recharger', ()=>{
              nw.postMessage('SKIP_WAITING');
              setTimeout(()=>location.reload(), 200);
            });
          }
        });
      });
    }).catch(()=>{});
  });
}
</script>
