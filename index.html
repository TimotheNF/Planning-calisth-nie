<head>
<meta charset="UTF-8">

<title>Calisthénie</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0A0A0A;
  --surface-1:#141414;
  --surface-2:#1E1E1E;
  --line:#2E2E2E;
  --line-soft:#242424;
  --text-primary:#FFFFFF;
  --text-secondary:#9A9A98;
  --text-muted:#7A7A78;
  --brand:#FF6B00;
  --brand-2:#F5A623;
  --grad:linear-gradient(100deg,#FF6B00 0%,#F5A623 100%);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --good:#199e70; --warn:#c98500; --bad:#e66767;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);}
body{
  margin:0;padding-bottom:56px;color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;
  background-color:var(--bg);
  background-image:
    url('bg.jpg'),
    radial-gradient(820px 420px at 6% -8%, rgba(255,107,0,.16), transparent 60%),
    radial-gradient(700px 380px at 100% 2%, rgba(245,166,35,.10), transparent 62%);
  background-size:cover, auto, auto;
  background-position:center top, center, center;
  background-repeat:no-repeat, no-repeat, no-repeat;
  background-attachment:fixed;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg, rgba(10,10,10,.80), rgba(10,10,10,.94));}
header,nav,main,#toast{position:relative;z-index:1;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

/* ---------- Chrome ---------- */
header{position:sticky;top:0;z-index:30;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(10,10,10,.90);backdrop-filter:blur(16px);border-bottom:1px solid var(--line-soft);}
.headerRow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brandMark{width:36px;height:36px;flex:none;display:block;border-radius:50%;filter:drop-shadow(0 3px 12px rgba(255,107,0,.4));}

h1{margin:0;font-size:16px;font-weight:900;font-style:italic;letter-spacing:.02em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#saveState{font-size:11px;padding:5px 11px;border-radius:20px;white-space:nowrap;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-secondary);}
#saveState.warn{background:rgba(230,103,103,.16);border-color:rgba(230,103,103,.45);color:#f3aeae;}
nav{position:sticky;top:51px;z-index:29;background:rgba(10,10,10,.90);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);overflow-x:auto;white-space:nowrap;padding:7px 10px;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav button{border:1px solid transparent;background:transparent;padding:7px 13px;margin-right:4px;border-radius:8px;
  font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--text-muted);cursor:pointer;font-family:inherit;}
nav button:hover{color:var(--text-secondary);}
nav button.active{background:var(--grad);color:#0A0A0A;border-color:transparent;}
main{padding:14px;max-width:1060px;margin:0 auto;}

/* ---------- Cartes ---------- */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.28);}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);}
.card.brandTop::before{background:var(--grad);}
.card h2{margin:0 0 4px;font-size:17px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.01em;}
.sub{color:var(--text-secondary);font-size:12.5px;line-height:1.55;margin-bottom:12px;}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px;}
.banner{border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.55;margin:12px 0;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-secondary);}
.banner b{color:var(--text-primary);}
.banner.ok{border-color:rgba(25,158,112,.5);background:rgba(25,158,112,.13);}
.banner.warn{border-color:rgba(242,194,48,.45);background:rgba(242,194,48,.11);}
.banner.bad{border-color:rgba(230,103,103,.5);background:rgba(230,103,103,.13);}

/* ---------- Contrôles ---------- */
input,textarea,select,button{font-family:inherit;}
input[type=text],input[type=number],input[type=date],input[type=password],textarea,select{
  font-size:13px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;
  background:#1B1E22;color:var(--text-primary);}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent;}
textarea{line-height:1.5;resize:vertical;}
label.lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:4px;}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-primary);transition:transform .06s ease;}
.btn:active{transform:scale(.97);}
.btn:hover{border-color:#4c525a;}
.btn.primary{background:var(--grad);border-color:transparent;color:#0A0A0A;}
.btn.go{background:var(--good);border-color:var(--good);color:#fff;}
.btn.warm{background:var(--brand-2);border-color:var(--brand-2);color:#0A0A0A;}
.btn.ghost{background:transparent;}
.btn.danger{color:#f3aeae;border-color:rgba(230,103,103,.45);background:transparent;}
.btn.small{padding:5px 10px;font-size:11.5px;border-radius:8px;}
.btn.block{width:100%;}
.btn.on{background:var(--grad);border-color:transparent;color:#0A0A0A;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.row>*{flex:1;min-width:130px;}
.delbtn{background:none;border:none;color:#e08585;cursor:pointer;font-size:15px;padding:3px 5px;}
.iconbtn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;padding:2px 4px;}

/* ---------- Tableaux ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
th,td{border-bottom:1px solid var(--line-soft);padding:8px 9px;text-align:center;white-space:nowrap;}
th{background:var(--surface-2);color:var(--text-secondary);font-weight:800;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;}
tr:last-child td{border-bottom:none;}
td.name{text-align:left;min-width:150px;}
td input,td select{padding:6px 8px;border-radius:8px;}
td input[type=number]{width:66px;}

/* ---------- Séance ---------- */
.seanceHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.badge{border-radius:7px;padding:5px 12px;font-size:11px;font-weight:900;font-style:italic;white-space:nowrap;letter-spacing:.04em;
  background:var(--grad);color:#0A0A0A;}
.exGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0 12px;}
.exTile{border:1px solid var(--line);border-radius:12px;padding:12px 10px;background:var(--surface-2);
  text-align:center;position:relative;overflow:hidden;}
.exTile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);}
.exTile .exName{font-size:11.5px;color:var(--text-secondary);font-weight:700;line-height:1.3;min-height:31px;
  display:flex;align-items:center;justify-content:center;}
.exTile .exReps{font-size:37px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1.02;color:var(--text-primary);}
.exTile .exU{font-size:10px;font-weight:800;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;}
.exTile .exMeta{font-size:10.5px;color:var(--text-muted);margin-top:5px;}
.kpiRow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.kpi{flex:1;min-width:96px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
.kpi .v{font-size:21px;font-weight:900;font-style:italic;letter-spacing:-.02em;}
.kpi .l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}

/* ---------- Chrono ---------- */
.timerTop{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.timerActions{display:flex;gap:8px;flex:1;justify-content:flex-end;}
.timerActions .btn{min-width:96px;}
.presetRow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;}
.presetRow .btn{padding:7px 4px;text-align:center;}
.timerDial{font-size:46px;font-weight:900;font-style:italic;letter-spacing:-.03em;min-width:118px;}
.timerDial.run{color:var(--brand);}
.timerDial.done{color:var(--good);}
.timerBar{height:5px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:10px;}
.timerFill{height:100%;background:var(--grad);width:0%;transition:width .25s linear;}

/* ---------- Paliers ---------- */
.palierRow{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:104px;overflow:auto;}
.chipP{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 8px;
  font-size:11px;font-weight:700;color:var(--text-muted);}
.chipP.cur{background:var(--grad);color:#0A0A0A;border-color:transparent;}
.chipP.done{color:var(--text-secondary);border-color:#4a4f56;}

/* ---------- Planning ---------- */
.weekGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.dayCard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.dayCard.today{border-color:var(--brand);box-shadow:0 0 0 1px rgba(255,107,0,.4);}
.dayHead{padding:9px 11px;font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-soft);}
.todayTag{font-size:9.5px;background:var(--grad);color:#0A0A0A;border-radius:6px;padding:2px 8px;letter-spacing:.04em;}
.dayBody{padding:9px;display:flex;flex-direction:column;gap:7px;flex:1;}
.slot{border:1px solid var(--line);border-left:3px solid var(--sc,#666);border-radius:9px;padding:7px 8px;background:var(--surface-1);}
.slotTop{display:flex;gap:4px;align-items:center;}
.slotTop select{flex:1;font-weight:700;font-size:12px;border:none;background:transparent;padding:2px 0;}
.slotNote{margin-top:3px;font-size:11.5px;border:none;background:transparent;padding:1px 0;color:var(--text-muted);}
.addSlot{border:1px dashed var(--line);background:transparent;color:var(--text-muted);border-radius:9px;padding:6px;font-size:11.5px;cursor:pointer;font-weight:700;}
.addSlot:hover{color:var(--text-primary);border-color:var(--text-muted);}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.chip{font-size:11px;border-radius:7px;padding:3px 10px;font-weight:800;color:#0A0A0A;}

/* ---------- Performances ---------- */
.prGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;}
.prCard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;
  position:relative;overflow:hidden;transition:border-color .12s ease;}
.prCard:hover{border-color:#4c525a;}
.prCard.sel{border-color:var(--acc);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent);}
.prName{font-size:11.5px;color:var(--text-secondary);font-weight:700;line-height:1.3;height:31px;overflow:hidden;}
.prName .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;}
.prVal{font-size:31px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1.1;margin-top:2px;}
.prUnit{font-size:11px;color:var(--text-muted);font-weight:700;margin-left:3px;}
.prDelta{font-size:11px;font-weight:800;margin-top:1px;}
.prDelta.up{color:var(--good);} .prDelta.flat{color:var(--text-muted);} .prDelta.down{color:var(--bad);}
.prSpark{margin-top:7px;height:34px;width:100%;display:block;}
canvas.mainChart{width:100%;height:250px;display:block;}
#chartTip{position:absolute;pointer-events:none;background:#0E1013;border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;font-size:11.5px;display:none;z-index:5;white-space:nowrap;}

/* ---------- Front Lever ---------- */
.flHead{display:flex;align-items:center;gap:11px;}
.flBadge{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#0A0A0A;font-weight:900;font-size:14px;flex:none;background:var(--grad);}
.warmGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;}
.warmItem{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:9px 11px;background:var(--surface-2);}

/* ---------- Divers ---------- */
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:center;font-size:12.5px;}
.kv .k{color:var(--text-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;word-break:break-all;color:var(--text-secondary);}
ol.steps{padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--text-secondary);}
ol.steps b{color:var(--text-primary);}
details.card summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none;display:flex;justify-content:space-between;}
details.card summary::after{content:'▾';color:var(--text-muted);}
details.card[open] summary::after{content:'▴';}
details.card summary::-webkit-details-marker{display:none;}
.syncHero{display:flex;gap:13px;align-items:center;}
.syncIcon{font-size:32px;line-height:1;flex:none;}
.syncTitle{font-size:16px;font-weight:900;font-style:italic;text-transform:uppercase;}
.syncDetail{font-size:12.5px;color:var(--text-secondary);margin-top:2px;}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#0E1013;border:1px solid var(--line);
  color:#fff;padding:11px 15px;border-radius:11px;font-size:12.5px;z-index:60;display:none;max-width:92vw;
  text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.7);}
#toast button{margin-left:9px;background:var(--brand);color:#0A0A0A;border:none;border-radius:7px;
  padding:4px 10px;font-size:11.5px;font-weight:800;cursor:pointer;}
@media (max-width:560px){
  main{padding:11px;}
  .card{padding:13px;}
  .kv{grid-template-columns:1fr;gap:4px 0;}
  .kv .k{margin-top:6px;}
  .timerDial{font-size:40px;min-width:96px;}
  .timerActions .btn{min-width:0;padding:9px 10px;}
  .presetRow{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>

    <div class="brand">

    <span id="saveState" onclick="switchTab('sync')">…</span>

</header>

<main id="mainArea"></main>

<script>
/* ===================== Données de référence ===================== */
const COURBE_DEFAUT = [1.25,2,2.5,3.25,4,4.5,5,5.25,6,6.25,6.5,7,7.25,7.5,8.25,8.5,9,9.5,10,10.25,
                       11,11.25,11.5,12,12.25,12.5,13.25,13.5,14,14.5,15.25,16,16.5,17.25,18.5];

  },
  test:{intervalleSemaines:8, series:"2", repos:"4 min", dernier:"",
        note:"Tous les 8 semaines : 2 séries au max par exercice, 4 min de repos. On garde le meilleur des deux."},
  seances:{
    streetOriginal:{
      label:"Street Originel", accent:"#3987e5", type:"progressive", leste:false, plusDe:"streetOriginalPlus",

      ],
      history:[]
    },
    street:{
      label:"Street", accent:"#199e70", type:"progressive", leste:false, plusDe:"streetPlus",
      toursCible:5,

      exercises:[

      history:[]
    },
    abdo:{
      label:"Abdo", accent:"#d55181", type:"circuit", basePct:0.6, growthPct:0.07, semaine:1,

<script>
/* ===================== Utils ===================== */
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDT(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function nombre(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function fmtKg(v){ return (Math.round(nombre(v)*100)/100).toString().replace('.',','); }
function actColor(n){ const a=ACTIVITIES.find(x=>x.name===n); return a?a.color:'#5A5A56'; }
function actTab(n){ const a=ACTIVITIES.find(x=>x.name===n); return a?a.tab:null; }
function semainesDepuis(iso){
  if(!iso) return null;
  const d=new Date(iso); if(isNaN(d)) return null;
  return Math.floor((Date.now()-d.getTime())/(7*24*3600*1000));
}

/* ===================== Stockage local ===================== */
const STORE_KEY='planning-calisthenie-v2';
let storageOK=false;
try{ window.localStorage.setItem('__t__','1'); window.localStorage.removeItem('__t__'); storageOK=true; }catch(e){ storageOK=false; }
function loadSaved(){
  if(!storageOK) return null;
  try{ const r=window.localStorage.getItem(STORE_KEY); if(!r) return null;
       const o=JSON.parse(r); return (o&&o.seances&&o.planning)?o:null; }catch(e){ return null; }
}

/* ===================== Synchro GitHub Gist ===================== */
const SYNC_KEY='planning-calisthenie-sync';
const GIST_FILE='planning-calisthenie.json';
let SYNC={enabled:false, token:'', gistId:'', lastRemoteAt:'', lastSyncAt:'', lastError:''};
let pushTimer=null, syncBusy=false, applyingRemote=false;
const PUSH_DEBOUNCE=5000, PUSH_MIN_INTERVAL=15000;
let lastLocalFP=null, lastPushedFP=null, lastPushAt=0, pushCooldownUntil=0;

function stateFingerprint(){ const c=deepClone(STATE); delete c.meta; return JSON.stringify(c); }
function isQuotaError(m){ return /rate limit|secondary rate|abuse detection|too many requests/i.test(m||''); }
function loadSync(){ if(!storageOK) return; try{ const r=window.localStorage.getItem(SYNC_KEY); if(r) SYNC=Object.assign(SYNC,JSON.parse(r)); }catch(e){} }
function saveSync(){ if(!storageOK) return; try{ window.localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC)); }catch(e){} }
function deviceLabel(){
  const u=navigator.userAgent||'';
  if(/iPhone|iPad/i.test(u)) return 'iPhone/iPad';
  if(/Android/i.test(u)) return 'Android';
  if(/Mac/i.test(u)) return 'Mac';
  if(/Windows/i.test(u)) return 'PC';
  return 'appareil';
}
function stampLocal(){
  if(!STATE.meta) STATE.meta={};
  STATE.meta.updatedAt=new Date().toISOString();
  STATE.meta.device=STATE.meta.device||deviceLabel();
}
function setSaveState(t,w){ const e=document.getElementById('saveState'); if(!e) return; e.textContent=t; e.className=w?'warn':''; }
function syncLabel(){
  if(!SYNC.enabled) return storageOK?'✓ Local':'⚠ Export requis';
  if(!navigator.onLine) return '🌐 hors-ligne';
  if(syncBusy) return '🌐 …';
  if(Date.now()<pushCooldownUntil) return '🌐 pause '+Math.ceil((pushCooldownUntil-Date.now())/60000)+' min';
  if(SYNC.lastError) return '🌐 erreur';
  if(SYNC.lastSyncAt) return '🌐 '+SYNC.lastSyncAt.slice(11,16);
  return '🌐 prêt';
}
function refreshSyncPill(){ setSaveState(SYNC.enabled?syncLabel():(storageOK?'✓ Sauvegarde auto':'⚠ Export requis'), !!SYNC.lastError||!storageOK); }
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,400); }
function saveNow(opts){
  const silent=(opts&&opts.silent)||applyingRemote;
  const fp=stateFingerprint();
  const changed=(fp!==lastLocalFP);
  if(!changed && !silent) return;
  if(!silent) stampLocal();
  lastLocalFP=fp;
  if(storageOK){
    try{ window.localStorage.setItem(STORE_KEY,JSON.stringify(STATE)); refreshSyncPill(); }
    catch(e){ setSaveState('⚠ Stockage plein',true); }
  }
  if(!silent && SYNC.enabled) schedulePush();
}
async function ghFetch(path,opts){
  const res=await fetch('https://api.github.com'+path,Object.assign({
    headers:{'Authorization':'Bearer '+SYNC.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
  },opts||{}));
  if(!res.ok){
    let m=res.status+' '+res.statusText;
    try{ const j=await res.json(); if(j.message) m+=' — '+j.message; }catch(e){}
    throw new Error(m);
  }
  return res.json();
}
function schedulePush(){
  if(!SYNC.enabled) return;
  clearTimeout(pushTimer);
  const now=Date.now();
  pushTimer=setTimeout(()=>pushRemote(true), Math.max(PUSH_DEBOUNCE,(lastPushAt+PUSH_MIN_INTERVAL)-now,pushCooldownUntil-now));
}
async function pushRemote(auto){
  if(!SYNC.enabled||!SYNC.token) return;
  if(!navigator.onLine){ SYNC.lastError=''; refreshSyncPill(); return; }
  const fp=stateFingerprint();
  if(auto){
    if(fp===lastPushedFP) return;
    if(Date.now()<pushCooldownUntil){ schedulePush(); return; }
  }
  syncBusy=true; refreshSyncPill();
  try{
    const body={files:{}};
    body.files[GIST_FILE]={content:JSON.stringify(deepClone(STATE),null,1)};
    let g;
    if(SYNC.gistId){
      const remote=await ghFetch('/gists/'+SYNC.gistId);
      const rf=remote.files&&remote.files[GIST_FILE];
      if(rf&&SYNC.lastRemoteAt&&remote.updated_at!==SYNC.lastRemoteAt){
        let rd=null;
        try{ rd=JSON.parse(rf.truncated ? await (await fetch(rf.raw_url)).text() : rf.content); }catch(e){}
        const rAt=rd&&rd.meta?rd.meta.updatedAt:null, lAt=STATE.meta?STATE.meta.updatedAt:null;
        if(rAt&&lAt&&rAt>lAt){
          syncBusy=false; SYNC.lastError='conflit'; refreshSyncPill(); saveSync();
          toast('Version distante plus récente ('+fmtDT(rAt)+').','Récupérer',()=>pullRemote(true));
          return;
        }
      }
      body.description='Calisthénie — sauvegarde ('+deviceLabel()+')';
      g=await ghFetch('/gists/'+SYNC.gistId,{method:'PATCH',body:JSON.stringify(body)});
    }else{
      body.public=false; body.description='Calisthénie — sauvegarde ('+deviceLabel()+')';
      g=await ghFetch('/gists',{method:'POST',body:JSON.stringify(body)});
      SYNC.gistId=g.id;
    }
    SYNC.lastRemoteAt=g.updated_at; SYNC.lastSyncAt=new Date().toISOString(); SYNC.lastError='';
    lastPushedFP=fp; lastPushAt=Date.now(); pushCooldownUntil=0;
    saveSync(); syncBusy=false; refreshSyncPill();
    const gf=document.getElementById('syncGist'); if(gf&&!gf.value) gf.value=SYNC.gistId;
    if(!auto) toast('Envoyé sur GitHub ✓');
  }catch(e){
    syncBusy=false; lastPushAt=Date.now();
    if(isQuotaError(e.message)){ pushCooldownUntil=Date.now()+20*60*1000; SYNC.lastError='Quota GitHub atteint. Pause automatique de 20 min.'; }
    else SYNC.lastError=e.message;
    saveSync(); refreshSyncPill();
    if(!auto) alert("Échec de l'envoi : "+SYNC.lastError);
  }
}
async function pullRemote(force){
  if(!SYNC.enabled||!SYNC.token||!SYNC.gistId) return;
  if(!navigator.onLine) return;
  if(!force&&Date.now()<pushCooldownUntil) return;
  syncBusy=true; refreshSyncPill();
  try{
    const g=await ghFetch('/gists/'+SYNC.gistId);
    const f=g.files&&g.files[GIST_FILE];
    if(!f) throw new Error('fichier '+GIST_FILE+' absent du Gist');
    const obj=JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content);
    if(!obj.seances||!obj.planning) throw new Error('contenu inattendu');
    const rAt=obj.meta?obj.meta.updatedAt:null, lAt=STATE.meta?STATE.meta.updatedAt:null;
    if(!force&&lAt&&rAt&&rAt<=lAt){
      SYNC.lastRemoteAt=g.updated_at; SYNC.lastSyncAt=new Date().toISOString(); SYNC.lastError='';
      saveSync(); syncBusy=false; refreshSyncPill(); return;
    }
    STATE=obj; migrate(); syncRefs();
    selectedPerf=null;
    applyingRemote=true;
    SYNC.lastRemoteAt=g.updated_at; SYNC.lastSyncAt=new Date().toISOString(); SYNC.lastError='';
    saveSync(); saveNow({silent:true}); syncBusy=false;
    lastPushedFP=stateFingerprint(); lastLocalFP=lastPushedFP;
    renderPage(); applyingRemote=false; refreshSyncPill();
    toast('Données récupérées ✓');
  }catch(e){
    syncBusy=false;
    if(isQuotaError(e.message)){ pushCooldownUntil=Date.now()+20*60*1000; SYNC.lastError='Quota GitHub atteint. Pause automatique de 20 min.'; }
    else SYNC.lastError=e.message;
    saveSync(); refreshSyncPill();
    if(force) alert('Échec de la récupération : '+SYNC.lastError);
  }
}
let toastTimer=null;
function toast(msg,label,action){
  const el=document.getElementById('toast'); if(!el) return;
  el.innerHTML=escapeHtml(msg)+(label?`<button id="toastBtn">${escapeHtml(label)}</button>`:'');
  el.style.display='block';
  if(label) document.getElementById('toastBtn').onclick=()=>{ el.style.display='none'; if(action) action(); };
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ el.style.display='none'; }, label?12000:3800);
}

/* ===================== État ===================== */
let STATE=loadSaved()||deepClone(SEED);
let currentTab='planning';
let selectedPerf=null;

const TABS=[
  {id:'planning',           label:'Planning'},
  {id:'streetOriginal',     label:'Street Originel'},
  {id:'streetOriginalPlus', label:'Originel +'},
  {id:'street',             label:'Street'},
  {id:'streetPlus',         label:'Street +'},
  {id:'abdo',               label:'Abdo'},
  {id:'frontLever',         label:'Front Lever'},
  {id:'performances',       label:'Performances'},
  {id:'defiPompes',         label:'Défi Pompes'},
  {id:'fullPlanche',        label:'Full Planche'},
  {id:'sync',               label:'🌐 Synchro'}
];
const SEANCE_KEYS=['streetOriginal','streetOriginalPlus','street','streetPlus','abdo'];
const PROG_KEYS=['streetOriginal','streetOriginalPlus','street','streetPlus'];
function isProg(k){ return PROG_KEYS.indexOf(k)>=0; }

/* ===================== Perfs ↔ Max réf. ===================== */
function latestPerf(n){
  const a=STATE.performances[n];
  if(!a||!a.length) return null;
  const s=a.slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  const v=s[s.length-1].reps;
  return (typeof v==='number'&&!isNaN(v))?v:null;
}
function perfSerie(n){
  const a=STATE.performances[n];
  if(!a||!a.length) return [];
  return a.slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)));
}
function syncRefs(){
  const s=STATE.seances.abdo;
  if(!s||!s.blocks) return;
  s.blocks.forEach(b=>b.exercises.forEach(ex=>{
    if(ex.auto===undefined) ex.auto=true;
    if(ex.auto){ const p=latestPerf(ex.name); if(p!==null&&p>0) ex.ref=p; }
  }));
}
function exNames(k){
  const s=STATE.seances[k];
  if(!s) return [];
  if(s.type==='progressive') return s.exercises.map(e=>e.name).filter(Boolean);
  const o=[]; (s.blocks||[]).forEach(b=>b.exercises.forEach(e=>{ if(e.name) o.push(e.name); })); return o;
}
function tousExercices(){
  const n=new Set(Object.keys(STATE.performances));
  SEANCE_KEYS.forEach(k=>exNames(k).forEach(x=>n.add(x)));
  STATE.frontLever.seances.forEach(s=>s.exercises.forEach(e=>n.add(e.name)));
  return Array.from(n).filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr'));
}

/* ===================== Navigation ===================== */
function renderNav(){
  document.getElementById('tabnav').innerHTML=TABS.map(t=>
    `<button data-tab="${t.id}" class="${t.id===currentTab?'active':''}" onclick="switchTab('${t.id}')">${escapeHtml(t.label)}</button>`).join('');
  const a=document.querySelector('#tabnav button.active');
  if(a&&a.scrollIntoView) a.scrollIntoView({inline:'center',block:'nearest'});
}
function switchTab(id){ currentTab=id; renderNav(); renderPage(); window.scrollTo({top:0,behavior:'instant'}); }

function renderPage(){
  syncRefs();
  const m=document.getElementById('mainArea');
  if(isProg(currentTab)){ m.innerHTML=renderProg(currentTab); afterProg(currentTab); }
  else if(currentTab==='abdo'){ m.innerHTML=renderAbdo(); recomputeAbdo(); timerPaint(); }
  else if(currentTab==='planning') m.innerHTML=renderPlanning();
  else if(currentTab==='performances'){ m.innerHTML=renderPerf(); afterPerf(); }
  else if(currentTab==='frontLever'){ m.innerHTML=renderFrontLever(); timerPaint(); }
  else if(currentTab==='fullPlanche') m.innerHTML=renderPhase('fullPlanche','Full Planche','var(--brand)');
  else if(currentTab==='defiPompes'){ m.innerHTML=renderDefi(); recomputeDefi(); }
  else if(currentTab==='sync') m.innerHTML=renderSync();
  scheduleSave();
}

/* ===================== Planning ===================== */
function todayIndex(){ return (new Date().getDay()+6)%7; }
function renderPlanning(){
  const p=STATE.planning, ti=todayIndex();
  const opts=a=>ACTIVITIES.map(x=>`<option value="${escapeAttr(x.name)}" ${x.name===a?'selected':''}>${escapeHtml(x.name)}</option>`).join('');
  const days=p.days.map((d,di)=>{
    const slots=d.slots.map((s,si)=>{
      const tab=actTab(s.act);
      return `<div class="slot" style="--sc:${actColor(s.act)}">
        <div class="slotTop">
          <select onchange="setSlotAct(${di},${si},this.value)">${opts(s.act)}</select>
          ${tab?`<button class="iconbtn" title="Ouvrir" onclick="switchTab('${tab}')">↗</button>`:''}
          <button class="delbtn" onclick="removeSlot(${di},${si})">✕</button>
        </div>
        <input class="slotNote" type="text" placeholder="note" value="${escapeAttr(s.note)}" oninput="STATE.planning.days[${di}].slots[${si}].note=this.value">
      </div>`;}).join('');
    return `<div class="dayCard ${di===ti?'today':''}">
      <div class="dayHead"><span>${escapeHtml(d.day)}</span>${di===ti?'<span class="todayTag">AUJOURD’HUI</span>':''}</div>
      <div class="dayBody">${slots||'<div style="font-size:11.5px;color:var(--text-muted);padding:3px 2px;">Rien de prévu.</div>'}
        <button class="addSlot" onclick="addSlot(${di})">+ Créneau</button></div></div>`;
  }).join('');
  const c={};
  p.days.forEach(d=>d.slots.forEach(s=>{ if(s.act!=='Repos') c[s.act]=(c[s.act]||0)+1; }));
  const legend=Object.keys(c).sort().map(k=>`<span class="chip" style="background:${actColor(k)}">${escapeHtml(k)} × ${c[k]}</span>`).join('')
    ||'<span style="font-size:11.5px;color:var(--text-muted)">Aucune séance placée.</span>';
  return `<div class="card" style="--acc:var(--brand)">
      <div class="eyebrow">Semaine type</div>
      <h2>Planning</h2>
      <div class="sub">${escapeHtml(p.note)}</div>
      <div class="weekGrid">${days}</div>
      <div class="legend">${legend}</div>
      <div class="row" style="margin-top:14px;">
        <button class="btn small" onclick="clearWeek()">Vider</button>
        <button class="btn small" onclick="shiftWeek()">Décaler d'un jour →</button>
      </div>
    </div>`;
}
function setSlotAct(d,s,v){ STATE.planning.days[d].slots[s].act=v; renderPage(); }
function addSlot(d){ STATE.planning.days[d].slots.push({act:'Libre / au feeling',note:''}); renderPage(); }
function removeSlot(d,s){ STATE.planning.days[d].slots.splice(s,1); renderPage(); }
function clearWeek(){ if(confirm('Vider tous les créneaux ?')){ STATE.planning.days.forEach(d=>d.slots=[{act:'Repos',note:''}]); renderPage(); } }
function shiftWeek(){ const d=STATE.planning.days, s=d.map(x=>x.slots); s.unshift(s.pop()); d.forEach((x,i)=>x.slots=s[i]); renderPage(); }

/* ===================== Chrono de repos ===================== */
const TIMER={total:90, reste:90, run:false, iv:null};
function tFmt(v){ const m=Math.floor(v/60), sec=v%60; return m+':'+String(sec).padStart(2,'0'); }
function timerPaint(){
  const d=document.getElementById('timerDial');
  if(d){
    d.textContent=tFmt(Math.max(0,TIMER.reste));
    d.className='timerDial num'+(TIMER.run?' run':'')+(TIMER.reste<=0?' done':'');
  }
  const f=document.getElementById('timerFill');
  if(f) f.style.width=(TIMER.total?Math.max(0,TIMER.reste)/TIMER.total*100:0)+'%';
  const b=document.getElementById('timerBtn');
  if(b) b.textContent=TIMER.run?'Pause':'Démarrer';
  document.querySelectorAll('[data-preset]').forEach(el=>{
    el.classList.toggle('on', nombre(el.dataset.preset)===TIMER.total);
  });
}
function timerSet(sec){ TIMER.total=sec; TIMER.reste=sec; timerStop(); timerPaint(); }
function timerStop(){ TIMER.run=false; if(TIMER.iv){ clearInterval(TIMER.iv); TIMER.iv=null; } }
function timerToggle(){
  if(TIMER.run){ timerStop(); timerPaint(); return; }
  if(TIMER.reste<=0) TIMER.reste=TIMER.total;
  TIMER.run=true;
  TIMER.iv=setInterval(()=>{
    TIMER.reste--;
    if(TIMER.reste<=0){ TIMER.reste=0; timerStop(); timerFin(); }
    timerPaint();
  },1000);
  timerPaint();
}
function timerFin(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(C){ const a=new C(); [0,180,360].forEach(d=>{ const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=.14;
      o.start(a.currentTime+d/1000); o.stop(a.currentTime+d/1000+.12); }); }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([160,90,160]);
  toast('Repos terminé — série suivante.');
}
function renderTimer(){
  return `<div class="card" style="--acc:var(--brand-2)">
    <div class="eyebrow">Entre les séries</div>
    <div class="timerTop">
      <div id="timerDial" class="timerDial num">${tFmt(TIMER.reste)}</div>
      <div class="timerActions">
        <button class="btn primary" id="timerBtn" onclick="timerToggle()">${TIMER.run?'Pause':'Démarrer'}</button>
        <button class="btn ghost" onclick="timerSet(TIMER.total)">Zéro</button>
      </div>
    </div>
    <div class="timerBar"><div class="timerFill" id="timerFill"></div></div>
    <div class="presetRow">
      <button class="btn small" data-preset="60"  onclick="timerSet(60)">60 s</button>
      <button class="btn small" data-preset="90"  onclick="timerSet(90)">90 s</button>
      <button class="btn small" data-preset="120" onclick="timerSet(120)">2 min</button>
      <button class="btn small" data-preset="180" onclick="timerSet(180)">3 min</button>
      <button class="btn small" onclick="timerSet(TIMER.total+30)">+30 s</button>
    </div>
  </div>`;
}

function addProgEx(k){ STATE.seances[k].exercises.push({name:'Nouvel exercice',reps:5,repos:'2 min'}); renderPage(); }
function removeProgEx(k,i){ STATE.seances[k].exercises.splice(i,1); renderPage(); }
function setPaliersFromText(){
  const el=document.getElementById('palierText'); if(!el) return;
  const a=String(el.value).split(/[\n;]+/).map(x=>parseFloat(String(x).replace(/kg/ig,'').replace(',','.').trim())).filter(v=>!isNaN(v)&&v>0);
  if(!a.length){ alert('Entre au moins un poids, un par ligne.'); return; }
  STATE.courbePoids.paliers=a; renderPage(); saveNow();
  toast(a.length+' paliers enregistrés.');
}
function bougePalier(k,d){
  const s=STATE.seances[k];
  s.palier=Math.max(0,Math.min((s.palier||0)+d,paliers().length-1));
  renderPage(); saveNow();
}
function validerSeance(key){
  const s=STATE.seances[key], cible=nombre(s.toursCible)||5, leste=!!s.leste;
  const dEl=document.getElementById('vDate_'+key);
  const date=(dEl&&dEl.value)?dEl.value:today();
  const tours=parseFloat(document.getElementById('vTours_'+key).value);
  if(isNaN(tours)){ alert('Entre le nombre de tours complets.'); return; }
  let partiel=null;
  const cb=document.getElementById('vPart_'+key);
  if(cb&&cb.checked){
    partiel=s.exercises.map((e,i)=>{
      const v=parseFloat((document.getElementById('vp_'+key+'_'+i)||{}).value);
      return isNaN(v)?0:v;
    });
    if(!partiel.some(v=>v>0)) partiel=null;
  }
  const reussi=tours>=cible;
  const entry={date,tours,cible,partiel,objectif:objectifStr(s),charge:leste?chargeDe(s.palier||0):0,reussi,
               avant:{reps:s.exercises.map(e=>nombre(e.reps)),palier:s.palier||0}};
  let msg;
  if(reussi){
    if(leste){
      if((s.palier||0)<paliers().length-1){ s.palier=(s.palier||0)+1; msg='Réussi. Prochaine séance à +'+fmtKg(chargeDe(s.palier))+' kg.'; }
      else msg='Réussi, mais tu es au dernier palier de la liste.';
    }else{
      s.exercises.forEach(e=>{ e.reps=nombre(e.reps)+1; });
      msg='Réussi. Prochaine séance : '+objectifStr(s)+'.';
    }
  }else{
    msg='Séance enregistrée ('+tours+'/'+cible+(partiel?' + '+partiel.join('/'):'')+'). Objectif inchangé.';
  }
  if(!s.history) s.history=[];
  s.history.unshift(entry);
  renderPage(); saveNow(); toast(msg);
}
function annulerDerniere(key){
  const s=STATE.seances[key];
  if(!s.history||!s.history.length){ alert('Aucune séance à annuler.'); return; }
  const h=s.history[0];
  if(!confirm('Annuler la séance du '+h.date+' ?')) return;
  if(h.avant){
    s.exercises.forEach((e,i)=>{ if(h.avant.reps[i]!==undefined) e.reps=h.avant.reps[i]; });
    s.palier=h.avant.palier;
  }
  s.history.shift(); renderPage(); saveNow(); toast('Séance annulée.');
}
function toggleTest(key){

    </div>
    <div class="tablewrap"><table>
      <thead><tr><th style="text-align:left;">Exercice</th><th>Série 1</th><th>Série 2</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <button class="btn warm" style="margin-top:10px;" onclick="saveTest('${key}')">Enregistrer le test</button>
  </div>`;

function saveTest(key){
  const dEl=document.getElementById('testDate_'+key);
  const date=(dEl&&dEl.value)?dEl.value:today();
  let n=0;
  exNames(key).forEach((nom,i)=>{
    const a=parseFloat((document.getElementById('t1_'+key+'_'+i)||{}).value);
    const b=parseFloat((document.getElementById('t2_'+key+'_'+i)||{}).value);
    const v=[a,b].filter(x=>!isNaN(x));
    if(!v.length) return;
    if(!STATE.performances[nom]) STATE.performances[nom]=[];
    STATE.performances[nom]=STATE.performances[nom].filter(e=>e.date!==date);
    STATE.performances[nom].push({date,reps:Math.max.apply(null,v)});
    STATE.performances[nom].sort((x,y)=>String(x.date).localeCompare(String(y.date)));
    n++;
  });
  if(!n){ alert('Aucune valeur saisie.'); return; }
  STATE.test.dernier=date;
  syncRefs(); renderPage(); saveNow();
  toast(n+' test(s) enregistré(s).');
}

/* ===================== Abdo (circuit S1-S7) ===================== */
function computeWeekVal(ref,base,growth,w){ const r=nombre(ref); if(r<=0) return null; return Math.round(r*base*Math.pow(1+growth,w-1)); }

  const s=STATE.seances.abdo, cur=nombre(s.semaine)||1;
  const compact=window.innerWidth<640;
  const wks=compact?[cur]:[1,2,3,4,5,6,7];
  const heads=wks.map(n=>`<th style="${n===cur?'color:var(--s5);':''}">S${n}</th>`).join('');
  const rows=s.blocks[0].exercises.map((ex,i)=>{
    const cells=wks.map(n=>`<td class="num" id="w_${i}_${n}" style="${n===cur?'color:var(--text-primary);font-weight:700;':'color:var(--text-secondary);'}">—</td>`).join('');
    const auto=ex.auto!==false;
    return `<tr>
      <td class="name"><input type="text" value="${escapeAttr(ex.name)}" oninput="STATE.seances.abdo.blocks[0].exercises[${i}].name=this.value" onchange="renderPage()"></td>
      <td><div style="display:flex;gap:3px;align-items:center;justify-content:center;">
        <input type="number" value="${escapeAttr(ex.ref)}" oninput="setAbdoRef(${i},this.value)">
        <button class="iconbtn" title="${auto?'Suit ta dernière perf':'Valeur figée'}" onclick="toggleAbdoAuto(${i})">${auto?'🔄':'🔒'}</button>
      </div></td>
      ${cells}
      <td><input type="text" style="width:78px;" value="${escapeAttr(ex.repos)}" oninput="STATE.seances.abdo.blocks[0].exercises[${i}].repos=this.value"></td>
      <td><button class="delbtn" onclick="removeAbdoEx(${i})">🗑</button></td>
    </tr>`;}).join('');
  return `<div class="card" style="--acc:var(--brand)">
      <div class="seanceHead">
        <div><div class="eyebrow">Circuit AMRAP</div><h2>Abdo</h2></div>
        <span class="badge">Semaine ${cur}</span>
      </div>
      <textarea class="sub" rows="2" style="margin-top:8px;" oninput="STATE.seances.abdo.subtitle=this.value">${escapeHtml(s.subtitle)}</textarea>
      <div class="row" style="margin-bottom:12px;">
        <div><label class="lbl">Semaine du cycle</label>
          <select onchange="STATE.seances.abdo.semaine=nombre(this.value);renderPage()">
            ${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n===cur?'selected':''}>Semaine ${n}</option>`).join('')}
          </select></div>
        <div><label class="lbl">Base % (S1)</label><input type="number" value="${Math.round(s.basePct*100)}" oninput="STATE.seances.abdo.basePct=nombre(this.value)/100;recomputeAbdo()"></div>
        <div><label class="lbl">Progression / sem.</label><input type="number" value="${Math.round(s.growthPct*100)}" oninput="STATE.seances.abdo.growthPct=nombre(this.value)/100;recomputeAbdo()"></div>
      </div>
      <div class="banner">🔄 Le <b>Max réf.</b> suit automatiquement ta dernière performance loggée pour le même exercice. Le cadenas fige une valeur à la main.</div>
      <div class="tablewrap"><table>
        <thead><tr><th style="text-align:left;">Exercice</th><th>Max réf.</th>${heads}<th>Repos</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="row" style="margin-top:10px;">
        <button class="btn small" onclick="addAbdoEx()">+ Exercice</button>
        <button class="btn small" onclick="toggleTest('abdo')">Ouvrir le test</button>
      </div>
    </div>
    ${renderTimer()}
    <div id="testCard_abdo" style="display:none;">${renderTestCard('abdo')}</div>`;
}
function recomputeAbdo(){
  const s=STATE.seances.abdo, cur=nombre(s.semaine)||1;
  const wks=window.innerWidth<640?[cur]:[1,2,3,4,5,6,7];
  s.blocks[0].exercises.forEach((ex,i)=>wks.forEach(n=>{
    const c=document.getElementById('w_'+i+'_'+n);
    if(c){ const v=computeWeekVal(ex.ref,s.basePct,s.growthPct,n); c.textContent=(v===null?'—':v); }
  }));
}
function setAbdoRef(i,v){ const ex=STATE.seances.abdo.blocks[0].exercises[i]; ex.ref=nombre(v); ex.auto=false; recomputeAbdo(); scheduleSave(); }
function toggleAbdoAuto(i){ const ex=STATE.seances.abdo.blocks[0].exercises[i]; ex.auto=(ex.auto===false); renderPage(); }
function addAbdoEx(){ STATE.seances.abdo.blocks[0].exercises.push({name:'Nouvel exercice',ref:0,repos:'45s',auto:true}); renderPage(); }
function removeAbdoEx(i){ STATE.seances.abdo.blocks[0].exercises.splice(i,1); renderPage(); }

/* ===================== Performances ===================== */
const PR_COLORS=['#3987e5','#d95926','#199e70','#c98500','#d55181','#9085e9'];
function renderPerf(){
  const principaux=STATE.perfPrincipaux.filter(Boolean);
  const cards=principaux.map((n,i)=>{
    const serie=perfSerie(n), last=serie.length?serie[serie.length-1].reps:null;
    const prev=serie.length>1?serie[serie.length-2].reps:null;
    let delta='<div class="prDelta flat">—</div>';
    if(last!==null&&prev!==null){
      const d=last-prev;
      const cls=d>0?'up':(d<0?'down':'flat');

/* --- Graphiques : canvas natif, aucune dépendance --- */
function setupCanvas(c,h){
  const dpr=window.devicePixelRatio||1;
  const w=c.clientWidth||300; h=h||c.clientHeight||200;
  c.width=w*dpr; c.height=h*dpr;
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  return {ctx,w,h};
}
function drawSpark(c,vals,col){
  const {ctx,w,h}=setupCanvas(c,34);
  if(vals.length<2){
    if(vals.length){
      ctx.beginPath(); ctx.arc(w/2,h/2,3.5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
      ctx.fillStyle='#77766E'; ctx.font='10px system-ui'; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText('1 mesure',w/2,h/2+7);
    }
    return;
  }
  const max=Math.max.apply(null,vals), min=Math.min.apply(null,vals), r=(max-min)||1;
  const pts=vals.map((v,i)=>({x:i/(vals.length-1)*(w-6)+3, y:h-4-((v-min)/r)*(h-10)}));
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,col+'44'); g.addColorStop(1,col+'00');
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,h); ctx.lineTo(pts[0].x,h); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last.x,last.y,3,0,Math.PI*2);
  ctx.fillStyle=col; ctx.fill();
  ctx.strokeStyle='#232322'; ctx.lineWidth=2; ctx.stroke();
}
let chartPts=[], chartData=[];
function drawChart(c,serie,col){
  const {ctx,w,h}=setupCanvas(c,250);
  chartPts=[]; chartData=serie;
  if(!serie.length){
    ctx.fillStyle='#77766E'; ctx.font='13px system-ui'; ctx.textAlign='center';
    ctx.fillText('Aucune mesure enregistrée.',w/2,h/2);
    return;
  }
  const vals=serie.map(e=>e.reps);
  const padL=36,padR=14,padT=28,padB=28;
  const pw=w-padL-padR, ph=h-padT-padB;
  const max=Math.max.apply(null,vals), min=Math.min.apply(null,[0].concat(vals)), r=(max-min)||1;
  ctx.font='10px system-ui'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const v=min+r*i/4, y=padT+ph-(v-min)/r*ph;
    ctx.strokeStyle='#26262A'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+pw,y); ctx.stroke();
    ctx.fillStyle='#77766E'; ctx.fillText(Math.round(v),padL-8,y);
  }
  const n=vals.length, step=n>1?pw/(n-1):0;
  const pts=vals.map((v,i)=>({x:padL+(n>1?i*step:pw/2), y:padT+ph-(v-min)/r*ph}));
  chartPts=pts;
  const g=ctx.createLinearGradient(0,padT,0,padT+ph);
  g.addColorStop(0,col+'3a'); g.addColorStop(1,col+'00');
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.lineTo(pts[n-1].x,padT+ph); ctx.lineTo(pts[0].x,padT+ph); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
  pts.forEach((p,i)=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle=col; ctx.fill();
    ctx.strokeStyle='#1a1a19'; ctx.lineWidth=2; ctx.stroke();
  });
  // étiquette du dernier point uniquement
  const lp=pts[n-1];
  ctx.fillStyle='#F6F5F1'; ctx.font='700 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(vals[n-1], lp.x, lp.y-9);
  ctx.fillStyle='#77766E'; ctx.font='9.5px system-ui'; ctx.textBaseline='top'; ctx.textAlign='center';
  const every=Math.max(1,Math.ceil(n/6));
  serie.forEach((e,i)=>{ if(i%every!==0&&i!==n-1) return; ctx.fillText(String(e.date).slice(5),pts[i].x,padT+ph+8); });
  c.onmousemove=ev=>{
    const rect=c.getBoundingClientRect(), x=ev.clientX-rect.left;
    let bi=0,bd=1e9;
    chartPts.forEach((p,i)=>{ const d=Math.abs(p.x-x); if(d<bd){bd=d;bi=i;} });
    const tip=document.getElementById('chartTip');
    if(!tip||bd>40){ if(tip) tip.style.display='none'; return; }
    tip.style.display='block';
    tip.innerHTML='<b>'+escapeHtml(chartData[bi].reps)+'</b> · '+escapeHtml(chartData[bi].date);
    tip.style.left=Math.min(rect.width-110,Math.max(0,chartPts[bi].x-50))+'px';
    tip.style.top=(c.offsetTop+chartPts[bi].y-42)+'px';
  };
  c.onmouseleave=()=>{ const t=document.getElementById('chartTip'); if(t) t.style.display='none'; };
}

/* ===================== Synchro (page) ===================== */
function humanError(m){
  m=String(m||'');
  if(isQuotaError(m)) return "Quota GitHub atteint. L'appli se met en pause et reprend seule.";
  if(/^401/.test(m)) return "Token refusé : expiré, révoqué, ou mal collé.";
  if(/^403/.test(m)) return "Token sans la permission « gist ». Recrée-en un en cochant cette case.";
  if(/^404/.test(m)) return "Gist introuvable. Vide le champ Identifiant pour en recréer un.";
  if(/Failed to fetch|NetworkError/i.test(m)) return "Pas de connexion à GitHub.";
  return m;
}
function etatSync(){
  if(!SYNC.token) return {i:'⚙️',t:'Pas encore configuré',d:"Colle un token GitHub ci-dessous pour relier tes appareils.",c:'warn'};
  if(!SYNC.enabled) return {i:'⏸️',t:'Synchro en pause',d:"Tes données restent sur cet appareil.",c:'warn'};
  if(!navigator.onLine) return {i:'📴',t:'Hors-ligne',d:"L'appli fonctionne. La synchro reprendra avec le réseau.",c:'warn'};
  if(Date.now()<pushCooldownUntil) return {i:'⏳',t:'En pause '+Math.ceil((pushCooldownUntil-Date.now())/60000)+' min',d:"Quota GitHub atteint. Reprise automatique.",c:'warn'};
  if(SYNC.lastError) return {i:'⚠️',t:'Problème',d:humanError(SYNC.lastError),c:'bad'};
  if(!SYNC.lastSyncAt) return {i:'🌐',t:'Jamais synchronisé',d:"Clique sur Synchroniser pour créer ta sauvegarde en ligne.",c:'warn'};
  const min=Math.round((Date.now()-new Date(SYNC.lastSyncAt).getTime())/60000);
  return {i:'✅',t:'Synchronisé '+(min<1?"à l'instant":(min<60?'il y a '+min+' min':'le '+fmtDT(SYNC.lastSyncAt))),
          d:"Tes modifications partent automatiquement.",c:'ok'};
}
function renderSync(){
  const e=etatSync(), conf=!!SYNC.token;
  return `<div class="card ${e.c==='ok'?'':''}" style="--acc:${e.c==='ok'?'var(--good)':(e.c==='bad'?'var(--bad)':'var(--warn)')}">
      <div class="syncHero">
        <div class="syncIcon">${e.i}</div>
        <div><div class="syncTitle">${escapeHtml(e.t)}</div><div class="syncDetail">${escapeHtml(e.d)}</div></div>
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="btn primary" onclick="syncNow()">Synchroniser maintenant</button>
        <button class="btn" onclick="pairFlow()">📱 Lier un téléphone</button>
      </div>
      <div class="sub" style="margin:12px 0 0;">Dernière modification ici : ${escapeHtml(fmtDT(STATE.meta&&STATE.meta.updatedAt))}.</div>
    </div>

    <div class="card" style="--acc:var(--brand)">
      <h2>${conf?'Réglages':'Configurer'}</h2>
      ${conf?'':`<ol class="steps" style="margin:6px 0 12px;">
        <li>Crée un token GitHub — le lien coche déjà la bonne permission, tu valides en bas de page.</li>
        <li>Colle-le ici, coche <b>Activer</b>, puis <b>Enregistrer</b>.</li>
      </ol>
      <a class="btn primary" style="display:inline-block;text-decoration:none;margin-bottom:14px;" href="https://github.com/settings/tokens/new?scopes=gist&description=Calisthenie" target="_blank" rel="noopener">Créer mon token ↗</a>`}
      <div class="kv">
        <div class="k">Token</div><div><input type="password" id="syncToken" placeholder="ghp_…" value="${escapeAttr(SYNC.token)}" autocomplete="off"></div>
        <div class="k">Synchro auto</div><div><label style="font-size:12.5px;"><input type="checkbox" id="syncOn" ${SYNC.enabled?'checked':''} style="width:auto;margin-right:7px;">Activer</label></div>
      </div>
      <button class="btn primary" style="margin-top:12px;" onclick="applySyncSettings()">Enregistrer</button>
      <div class="sub" style="margin:12px 0 0;">Le token reste sur cet appareil. Il n'apparaît ni dans la sauvegarde en ligne, ni dans l'export.</div>
    </div>

    <details class="card" style="--acc:var(--line)" ${SYNC.lastError?'open':''}>
      <summary>Avancé</summary>
      <div class="kv" style="margin-top:14px;">
        <div class="k">Identifiant Gist</div><div><input type="text" id="syncGist" placeholder="vide = création auto" value="${escapeAttr(SYNC.gistId)}"></div>
        <div class="k">Sauvegarde</div><div class="mono">${SYNC.gistId?`<a href="https://gist.github.com/${escapeAttr(SYNC.gistId)}" target="_blank" rel="noopener" style="color:var(--s1)">gist.github.com/${escapeHtml(SYNC.gistId)}</a>`:'—'}</div>
        <div class="k">Dernier échange</div><div>${escapeHtml(fmtDT(SYNC.lastSyncAt))}</div>
        <div class="k">Message brut</div><div class="mono">${escapeHtml(SYNC.lastError||'aucun')}</div>
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="btn small" onclick="pushRemote(false)">⬆ Forcer l'envoi</button>
        <button class="btn small" onclick="pullRemote(true)">⬇ Forcer la récupération</button>
        <button class="btn small" onclick="exportData()">💾 Export</button>
        <button class="btn small" onclick="document.getElementById('importFile').click()">📂 Import</button>
        <button class="btn small danger" onclick="forgetSync()">Oublier le token</button>
        <button class="btn small danger" onclick="resetData()">↺ Réinitialiser</button>
      </div>
      <div class="sub" style="margin-top:14px;">En cas de conflit, l'appli compare les dates et refuse d'écraser une version plus récente. Le dernier appareil à enregistrer gagne, il n'y a pas de fusion.</div>
      <textarea id="pairLink" rows="3" class="mono" style="margin-top:10px;display:none;" readonly></textarea>
    </details>`;
}
async function syncNow(){
  if(!SYNC.token){ alert("Colle d'abord un token, puis Enregistrer."); return; }
  if(!SYNC.enabled){ SYNC.enabled=true; saveSync(); }
  if(!SYNC.gistId){ await pushRemote(false); renderPage(); return; }
  await pullRemote(false);
  if(stateFingerprint()!==lastPushedFP) await pushRemote(false);
  renderPage();
}
function applySyncSettings(){
  SYNC.token=document.getElementById('syncToken').value.trim();
  const g=document.getElementById('syncGist');
  if(g) SYNC.gistId=g.value.trim().replace(/^.*gist\.github\.com\//,'');
  SYNC.enabled=document.getElementById('syncOn').checked;
  SYNC.lastError='';
  if(SYNC.enabled&&!SYNC.token){ SYNC.enabled=false; alert('Il faut un token pour activer la synchro.'); }
  saveSync(); refreshSyncPill(); renderPage();
  if(SYNC.enabled) toast('Enregistré. Clique sur Synchroniser.');
}
function b64urlEncode(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64urlDecode(s){ return decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))); }
function makePairLink(){
  if(!SYNC.token||!SYNC.gistId) return null;
  return location.origin+location.pathname+'#pair='+b64urlEncode(JSON.stringify({t:SYNC.token,g:SYNC.gistId}));
}
function copyPairLink(){
  const l=makePairLink(); if(!l) return;
  const el=document.getElementById('pairLink');
  if(el){ el.style.display='block'; el.value=l; }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(l).catch(()=>{ if(el){el.select();document.execCommand('copy');} });
  else if(el){ el.select(); document.execCommand('copy'); }
}
function pairFlow(){
  const l=makePairLink();
  if(!l){ alert("Clique d'abord sur Synchroniser maintenant pour créer ta sauvegarde en ligne."); return; }
  copyPairLink();
  alert("Lien copié.\n\n1. Envoie-le-toi par un canal privé.\n2. Ouvre-le sur le téléphone : la synchro s'y configure toute seule.\n3. Supprime le lien ensuite — il contient ton token.");
}
function consumePairLink(){
  const m=(location.hash||'').match(/pair=([A-Za-z0-9\-_]+)/);
  if(!m) return false;
  try{
    const o=JSON.parse(b64urlDecode(m[1]));
    if(!o.t||!o.g) return false;
    SYNC.token=o.t; SYNC.gistId=o.g; SYNC.enabled=true;
    SYNC.lastRemoteAt=''; SYNC.lastSyncAt=''; SYNC.lastError='';
    saveSync(); history.replaceState(null,'',location.pathname);
    return true;
  }catch(e){ return false; }
}
function forgetSync(){
  if(!confirm("Effacer le token de cet appareil ? Le Gist reste intact sur GitHub.")) return;
  SYNC={enabled:false,token:'',gistId:'',lastRemoteAt:'',lastSyncAt:'',lastError:''};
  saveSync(); refreshSyncPill(); renderPage();
}

/* ===================== Export / Import / Reset ===================== */
function exportData(){
  const b=new Blob([JSON.stringify(STATE,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='calisthenie-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importData(evt){
  const f=evt.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const o=JSON.parse(e.target.result);
      if(!o.seances||!o.planning) throw new Error('structure inattendue');
      STATE=o; migrate(); syncRefs(); selectedPerf=null;
      renderPage(); saveNow(); toast('Données chargées ✓');
    }catch(err){ alert('Fichier invalide : '+err.message); }
  };
  r.readAsText(f); evt.target.value='';
}
function resetData(){
  if(!confirm("Repartir de zéro ? Tout ce qui est enregistré sur cet appareil sera effacé.")) return;
  STATE=deepClone(SEED); selectedPerf=null;
  if(storageOK){ try{ window.localStorage.removeItem(STORE_KEY); }catch(e){} }
  renderPage(); saveNow();
}

/* ===================== Migration ===================== */
function migrate(){
  if(!STATE.performances) STATE.performances={};
  const ancien = nombre(STATE.version) < 5;
  if(ancien){
    // Les versions precedentes conservaient l'ancien ordre d'exercices et l'ancienne
    // courbe de poids. On repart de la reference, en gardant l'historique et le palier.
    PROG_KEYS.forEach(k=>{
      const ref=SEED.seances[k], cur=STATE.seances&&STATE.seances[k];
      const hist=(cur&&Array.isArray(cur.history))?cur.history:[];
      const pal=(cur&&typeof cur.palier==='number')?cur.palier:0;
      if(!STATE.seances) STATE.seances={};
      STATE.seances[k]=deepClone(ref);
      STATE.seances[k].history=hist;
      if(ref.leste) STATE.seances[k].palier=Math.min(pal, COURBE_DEFAUT.length-1);
    });
    STATE.courbePoids=deepClone(SEED.courbePoids);
  }
  if(!STATE.courbePoids||!STATE.courbePoids.paliers||!STATE.courbePoids.paliers.length) STATE.courbePoids=deepClone(SEED.courbePoids);
  if(!STATE.test) STATE.test=deepClone(SEED.test);
  if(STATE.testProtocol) delete STATE.testProtocol;
  if(!STATE.perfPrincipaux||!STATE.perfPrincipaux.length) STATE.perfPrincipaux=SEED.perfPrincipaux.slice();
  if(!STATE.seances) STATE.seances={};
  ['jambes','complement','endurance','explosivite','super6b'].forEach(k=>{ delete STATE.seances[k]; });

  PROG_KEYS.forEach(k=>{
    const ref=SEED.seances[k];
    let s=STATE.seances[k];
    if(!s||s.type!=='progressive'||!Array.isArray(s.exercises)){
      const hist=(s&&Array.isArray(s.history))?s.history:[];
      STATE.seances[k]=deepClone(ref);
      STATE.seances[k].history=hist;
      return;
    }
    s.label=ref.label; s.accent=ref.accent; s.leste=ref.leste; s.plusDe=ref.plusDe;
    s.type='progressive';
    if(!s.history) s.history=[];
    if(!s.toursCible) s.toursCible=5;
    if(s.leste&&typeof s.palier!=='number') s.palier=0;
    s.exercises.forEach((e,i)=>{
      const m=ref.exercises[Math.min(i,ref.exercises.length-1)];
      if(!e.repos) e.repos=m.repos;
      if(e.reps===undefined) e.reps=m.reps;
    });
  });
  // ancien objet lest {actif,charge,palier}
  PROG_KEYS.forEach(k=>{ const s=STATE.seances[k]; if(s) s.exercises.forEach(e=>{ delete e.plafond; }); if(s&&s.lest){ if(s.leste&&typeof s.lest.palier==='number') s.palier=s.lest.palier; delete s.lest; } });
  delete STATE.seances.streetOriginalPlus_old;

  if(!STATE.seances.abdo||!STATE.seances.abdo.blocks) STATE.seances.abdo=deepClone(SEED.seances.abdo);
  STATE.seances.abdo.type='circuit';
  if(!STATE.seances.abdo.semaine) STATE.seances.abdo.semaine=nombre(STATE.semaine)||1;
  delete STATE.semaine;
  STATE.seances.abdo.blocks[0].exercises.forEach(ex=>{ if(ex.auto===undefined) ex.auto=true; });

  ['frontLever','fullPlanche','defiPompes','planning'].forEach(k=>{ if(!STATE[k]) STATE[k]=deepClone(SEED[k]); });
  (STATE.frontLever.seances||[]).forEach(s=>{ if(s.accent) delete s.accent; });
  (STATE.planning.days||[]).forEach(d=>(d.slots||[]).forEach(sl=>{
    if(sl.act==='Souplesse') sl.act='Mobilité';
    if(sl.act==='Street Original') sl.act='Street Originel';
    if(sl.act==='Street Original Plus') sl.act='Street Originel Plus';
  }));
  STATE.version=4;
}

/* ===================== Init ===================== */
migrate();
loadSync();
syncRefs();
lastLocalFP=stateFingerprint();

const paired=consumePairLink();
const h=(location.hash||'').replace('#','');
if(TABS.some(t=>t.id===h)) currentTab=h;
if(paired) currentTab='sync';

renderNav();
renderPage();
refreshSyncPill();

document.addEventListener('input',scheduleSave,true);
document.addEventListener('change',scheduleSave,true);
window.addEventListener('pagehide',()=>saveNow());
window.addEventListener('resize',()=>{ if(currentTab==='performances'||currentTab==='abdo') renderPage(); });
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') saveNow();
  else if(SYNC.enabled) pullRemote(false);
});
window.addEventListener('online',()=>{ refreshSyncPill(); if(SYNC.enabled) pullRemote(false); });
window.addEventListener('offline',refreshSyncPill);
if(paired){ toast('Appareil lié ✓ récupération…'); pullRemote(true); }
else if(SYNC.enabled) pullRemote(false);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            toast('Nouvelle version disponible.','Recharger',()=>{ nw.postMessage('SKIP_WAITING'); setTimeout(()=>location.reload(),200); });
          }
        });
      });
    }).catch(()=>{});
  });
}
</script>
